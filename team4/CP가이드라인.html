<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CP 가이드라인</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','맑은 고딕','Malgun Gothic',sans-serif;background:#f4f6fa;color:#222;min-height:100vh;font-size:14px}
.topbar{background:linear-gradient(90deg,#1A2D50 0%,#243962 100%);color:#fff;padding:14px 22px 12px;position:sticky;top:0;z-index:50;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.tb1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:17px;font-weight:700;letter-spacing:-.3px}
.topbar .sub{font-size:12px;color:#a8b8cf}
.topbar .meta{font-size:11.5px;color:#cfd8e3;margin-left:auto}
.sbox{margin-top:10px;display:flex;gap:8px;align-items:center}
.sbox input{flex:1;max-width:620px;font-size:15px;padding:10px 14px;border-radius:9px;border:none;outline:none;font-family:inherit;box-shadow:inset 0 0 0 2px transparent}
.sbox input:focus{box-shadow:inset 0 0 0 2px #FA4100}
.sbox button{border:none;background:rgba(255,255,255,.14);color:#fff;padding:9px 12px;border-radius:8px;font-family:inherit;font-size:12.5px;cursor:pointer}
.sbox .cnt{font-size:12.5px;color:#ffd7c4;min-width:90px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chips span{font-size:12px;background:rgba(255,255,255,.1);color:#dfe6f2;padding:4px 10px;border-radius:14px;cursor:pointer;user-select:none}
.chips span:hover,.chips span.on{background:#FA4100;color:#fff}
.layout{display:flex;max-width:1280px;margin:0 auto;gap:18px;padding:18px 22px 60px}
nav{width:200px;flex:none;position:sticky;top:150px;align-self:flex-start}
nav a{display:block;padding:8px 10px;border-radius:7px;color:#243962;text-decoration:none;font-size:13px;margin-bottom:2px}
nav a:hover{background:#e8eef8}
nav a .n{float:right;font-size:11px;color:#FA4100;font-weight:700}
nav .grp{font-size:11px;color:#8a95a8;margin:12px 10px 4px;font-weight:700}
main{flex:1;min-width:0}
.section{margin-bottom:22px;background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;border:1px solid #e5e9f0;scroll-margin-top:160px}
.section-h{padding:13px 18px;background:#f8fafd;border-bottom:1px solid #e5e9f0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.section-h .tag{font-size:11px;background:#1A2D50;color:#fff;padding:3px 8px;border-radius:5px;font-weight:700}
.section-h .ttl{font-size:15.5px;color:#1A2D50;font-weight:700}
.section-h .note{font-size:11.5px;color:#7a8597;margin-left:auto}
.section-h a.pdf{font-size:11.5px;color:#008C32;text-decoration:none;font-weight:700}
.section-body{padding:6px 18px 14px}
.secnote{font-size:12px;color:#5a6577;background:#f8fafd;border-radius:7px;padding:8px 11px;margin:10px 0 4px}
.row{display:flex;gap:16px;padding:11px 0;border-bottom:1px solid #eef1f6}
.row:last-child{border-bottom:none}
.row .k{width:170px;flex:none;font-weight:700;color:#243962;font-size:13.5px}
.row ul{list-style:none;flex:1}
.row li{line-height:1.65;padding:1px 0 1px 14px;position:relative}
.row li:before{content:'';position:absolute;left:2px;top:.75em;width:5px;height:5px;border-radius:50%;background:#b9c4de}
.row li.ban{color:#c1352b;font-weight:600}
.row li.ban:before{background:#c1352b}
.row li.ref{color:#5a6577;font-size:13px}
.row li.ref:before{background:transparent}
mark{background:#ffe08a;color:inherit;border-radius:2px;padding:0 1px}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px;padding:14px 18px 16px}
.q{border:1px solid #e5e9f0;border-radius:10px;padding:11px 13px;cursor:pointer;background:#fff;transition:.15s}
.q:hover{border-color:#008C32;box-shadow:0 2px 8px rgba(0,140,50,.12)}
.q .l{font-size:12px;color:#7a8597}
.q .v{font-size:19px;font-weight:800;color:#1A2D50;margin:2px 0}
.q .d{font-size:11.5px;color:#5a6577;line-height:1.45}
.tw{overflow-x:auto;padding:12px 18px 16px}
table.c{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:760px}
table.c th,table.c td{padding:9px 10px;border-bottom:1px solid #eef1f6;vertical-align:top;text-align:left;line-height:1.55}
table.c thead th{background:#1A2D50;color:#fff;font-weight:600;position:sticky;top:0}
table.c td.k{font-weight:700;color:#243962;white-space:nowrap;background:#f8fafd}
table.c td.diff{background:#fdeee9;color:#b3261e;font-weight:600}
table.c td.same{color:#8a95a8}
table.c tr.hide{display:none}
.legend{font-size:11.5px;color:#7a8597;padding:0 18px 12px}
.legend i{display:inline-block;width:11px;height:11px;background:#fdeee9;border:1px solid #f3c3b8;vertical-align:-1px;margin-right:4px}
.co-sel{display:flex;gap:6px;padding:12px 18px 0;flex-wrap:wrap}
.co-sel label{font-size:12.5px;border:1px solid #d5dce8;border-radius:16px;padding:4px 11px;cursor:pointer;user-select:none}
.co-sel input{display:none}
.co-sel label.on{background:#1A2D50;color:#fff;border-color:#1A2D50}
.empty{display:none;text-align:center;color:#7a8597;padding:50px 0;font-size:14px}
.hidden{display:none!important}
.foot{font-size:11px;color:#8a95a8;text-align:center;margin-top:20px}
@media(max-width:820px){
  nav{display:none}
  .layout{padding:12px 12px 50px}
  .topbar{padding:12px 14px 10px}
  .row{flex-direction:column;gap:4px}
  .row .k{width:auto}
  .section-h .note{margin-left:0}
  .quick{grid-template-columns:1fr 1fr;padding:10px 12px 12px;gap:8px}
  .q .v{font-size:16px}
  .topbar .sub{display:none}
}
@media print{.topbar,nav{display:none}.section{break-inside:avoid}}
</style></head>
<body>
<div class="topbar">
  <div class="tb1">
    <h1>CP 가이드라인</h1>
    <span class="sub">제품설명회 · 강연료 · 관계사 · 견본품 · 기부</span>
    <span class="meta">사외비 · 원본 PDF 기준 2026-10-01 수록</span>
  </div>
  <div class="sbox">
    <input id="q" type="search" placeholder="검색: 예) 주류, 강연료 공무원, 숙박 신고, BMS 방명록" autocomplete="off">
    <button onclick="setQ('')">초기화</button>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="chips" id="chips"></div>
</div>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

  const chips = ['식음료','주류','거리','강연료','좌장','기념품','숙박','방명록','협회 신고','결과보고','청탁금지법','견본품','기부','BMS','길리어드'];
  $('#chips').innerHTML = chips.map(c=>'<span>'+c+'</span>').join('');
  $('#chips').onclick = e => { if(e.target.tagName==='SPAN') setQ($('#q').value.trim()===e.target.textContent ? '' : e.target.textContent); };
}
function li(t){
  let cls = '';
  if (t[0] === '!') { cls = 'ban'; t = t.slice(1); }
  else if (t[0] === '※' || t[0] === '*') cls = 'ref';
  return '<li class="'+cls+'" data-raw="'+esc(t)+'">'+esc(t)+'</li>';
}
function secGuide(g){
  return '<div class="section" id="s-'+g.id+'"><div class="section-h"><span class="tag">'+esc(g.tag)+'</span><span class="ttl">'+esc(g.title)+'</span>'
    + '<span class="note">'+esc([g.dept, g.date].filter(Boolean).join(' · '))+'</span>'+(LOCAL?'<a class="pdf" href="'+pdfHref(g.pdf)+'" target="_blank">PDF</a>':'')+'</div><div class="section-body">'
    + (g.note ? '<div class="secnote">'+esc(g.note)+'</div>' : '')
    + g.rows.map(r => '<div class="row sr"><div class="k" data-raw="'+esc(r[0])+'">'+esc(r[0])+'</div><ul>'+r[1].map(li).join('')+'</ul></div>').join('')
    + '</div></div>';
}
function secRel(){
  const R = D.rel, C = D.companies;
  let h = '<div class="section" id="s-rel"><div class="section-h"><span class="tag">관계사</span><span class="ttl">'+esc(R.title)+'</span><span class="note">'+esc(R.date)+'</span>'+(LOCAL?'<a class="pdf" href="'+pdfHref(R.pdf)+'" target="_blank">PDF</a>':'')+'</div>';
  h += '<div class="co-sel" id="cosel">'+C.map((c,i)=>'<label class="on"><input type="checkbox" checked data-i="'+i+'">'+esc(c)+'</label>').join('')+'</div>';
  h += '<div class="tw"><table class="c" id="reltbl"><thead><tr><th>구분</th>'+C.map((c,i)=>'<th data-ci="'+i+'">'+esc(c)+'</th>').join('')+'</tr></thead><tbody>';
  R.rows.forEach(r => {
    h += '<tr class="sr"><td class="k">'+esc(r[0])+'</td>' + r[1].map((cell,i) => {
      const t = cell[0], same = i>0 && t === '유한 규정 준용';
      return '<td data-ci="'+i+'" class="'+(cell[1]?'diff':(same?'same':''))+'">'+esc(t).replace(/\n/g,'<br>')+'</td>';
    }).join('') + '</tr>';
  });
  h += '</tbody></table></div><div class="legend"><i></i>유한과 다른 기준 (원본 붉은 글씨) · 회사 버튼으로 열 숨기기 · '+esc(R.note)+'</div></div>';
  return h;
}

/* ── 검색 ── */
const SYN = D.syn;
function terms(q){
  // 띄어쓰기 = AND, 각 단어는 동의어 OR 그룹
  return q.toLowerCase().split(/\s+/).filter(Boolean).map(w => {
    const syn = [];
    Object.keys(SYN).forEach(k => { if (k.toLowerCase() === w) SYN[k].forEach(s => syn.push(s.toLowerCase())); });
    // 한 글자 동의어 키(술·밥)는 '학술'처럼 엉뚱하게 걸리므로 동의어로만 찾는다
    return (w.length === 1 && syn.length) ? syn : [w].concat(syn);
  });
}
function hit(text, T){ const t = text.toLowerCase(); return T.every(g => g.some(w => t.indexOf(w) >= 0)); }
function anyHit(text, T){ const t = text.toLowerCase(); return T.some(g => g.some(w => t.indexOf(w) >= 0)); }
function markHTML(raw, T){
  const words = [...new Set(T.flat())].filter(Boolean).sort((a,b)=>b.length-a.length);
  let s = esc(raw);
  if (!words.length) return s;
  const re = new RegExp('(' + words.map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')', 'gi');
  return s.replace(re, '<mark>$1</mark>');
}
function setQ(v){ $('#q').value = v; run(); $('#q').focus(); }
let timer;
$('#q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 120); });
function run(){
  const q = $('#q').value.trim(); const T = terms(q);
  document.querySelectorAll('#chips span').forEach(s => s.classList.toggle('on', s.textContent === q));
  let total = 0;
  try { history.replaceState(null, '', q ? '#q=' + encodeURIComponent(q) : location.pathname); } catch(e){}
  document.querySelectorAll('#main .section').forEach(sec => {
    let n = 0;
    if (sec.id === 's-quick') {
      let k = 0;
      sec.querySelectorAll('.q').forEach(c => { const ok = !q || hit(c.dataset.s, T); c.classList.toggle('hidden', !ok); if (ok) k++; });
      sec.classList.toggle('hidden', !!q && !k);
      return;
    }
    if (sec.id === 's-rel' || sec.id === 's-compare') {
      sec.querySelectorAll('tr.sr').forEach(tr => {
        const ok = !q || hit(tr.textContent, T);
        tr.classList.toggle('hide', !ok); if (ok) n++;
        tr.querySelectorAll('td').forEach(td => {
          if (!td.dataset.raw) td.dataset.raw = td.innerHTML;
          td.innerHTML = q && ok ? td.dataset.raw.split('<br>').map(x => markHTML(x.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>'), T)).join('<br>') : td.dataset.raw;
        });
      });
    } else {
      const title = sec.querySelector('.ttl').textContent + ' ' + sec.querySelector('.tag').textContent;
      sec.querySelectorAll('.row').forEach(row => {
        const k = row.querySelector('.k');
        const ctx = title + ' ' + k.dataset.raw;
        let rn = 0;
        row.querySelectorAll('li').forEach(l => {
          // 항목명·문서명 + 본문을 합쳐 AND 판정 → "숙박 신고"처럼 제목+내용 조합도 찾음
          const ok = !q || (hit(ctx + ' ' + l.dataset.raw, T) && anyHit(l.dataset.raw + ' ' + k.dataset.raw, T));
          l.classList.toggle('hidden', !ok);
          l.innerHTML = q && ok ? markHTML(l.dataset.raw, T) : esc(l.dataset.raw);
          if (ok) rn++;
        });
        k.innerHTML = q ? markHTML(k.dataset.raw, T) : esc(k.dataset.raw);
        row.classList.toggle('hidden', !!q && !rn);
        n += rn;
      });
    }
    sec.classList.toggle('hidden', !!q && !n);
    const a = document.querySelector('[data-nav="'+sec.id+'"] .n');
    if (a) a.textContent = q && n ? n : '';
    const na = document.querySelector('[data-nav="'+sec.id+'"]');
    if (na) na.style.opacity = q && !n ? .35 : 1;
    total += n;
  });
  $('#cnt').textContent = q ? total + '건 찾음' : '';
  $('#empty').style.display = q && !total ? 'block' : 'none';
}
function go(id){ setQ(''); const el = document.getElementById(id); if (el) el.scrollIntoView({behavior:'smooth'}); }

build();
// 관계사 열 토글
$('#cosel').addEventListener('change', e => {
  const i = e.target.dataset.i, on = e.target.checked;
  e.target.parentNode.classList.toggle('on', on);
  document.querySelectorAll('#reltbl [data-ci="'+i+'"]').forEach(c => c.style.display = on ? '' : 'none');
});
// 주소의 #q=검색어 로 바로 검색 (통합분석에서 링크로 열 때)
const m0 = location.hash.match(/^#q=(.+)/);
if (m0) { $('#q').value = decodeURIComponent(m0[1]); run(); }
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape') setQ('');
});
