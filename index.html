<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>거래처지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'맑은 고딕',sans-serif; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
#topPanel {
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:8px 12px; background:#1A2D50; z-index:1000; position:relative;
}
#searchBox {
  flex:1; min-width:150px; max-width:240px;
  padding:7px 12px; border:none; border-radius:20px;
  font-size:13px; outline:none;
}
#personSelect {
  padding:7px 10px; border:none; border-radius:20px;
  font-size:13px; cursor:pointer; outline:none; background:white; color:#333;
}
.toggleBtn {
  padding:5px 12px; border:2px solid transparent; border-radius:20px;
  font-size:12px; cursor:pointer; color:white; font-weight:bold;
  transition:opacity 0.2s, transform 0.1s;
}
.toggleBtn.off { opacity:0.3; }
#countBadge { margin-left:auto; color:#9ab; font-size:12px; white-space:nowrap; }
#searchDropdown {
  position:fixed; top:52px; left:12px; width:250px;
  background:white; border-radius:8px;
  box-shadow:0 4px 16px rgba(0,0,0,0.22);
  z-index:9999; max-height:280px; overflow-y:auto; display:none;
}
.searchItem {
  padding:9px 14px; font-size:13px; cursor:pointer;
  border-bottom:1px solid #f0f0f0; color:#333;
}
.searchItem:hover { background:#f5f8ff; }
.searchItem b { color:#4a90d9; }
#map { flex:1; }
#card {
  display:none; position:fixed; left:14px; bottom:16px; z-index:9000;
  background:#fff; border:1px solid #e3e8ef; border-radius:12px;
  box-shadow:0 8px 26px rgba(0,0,0,.18); padding:14px 16px 13px;
  max-width:300px; font-family:'맑은 고딕',sans-serif; font-size:13px; line-height:1.6;
}
#card.on { display:block; }
#card .cx {
  position:absolute; right:8px; top:5px; border:none; background:none;
  font-size:18px; color:#8a93a0; cursor:pointer; line-height:1;
}
@media (max-width:640px) { #card { left:8px; right:8px; max-width:none; } }
#chartModal {
  display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.55); z-index:99999;
  align-items:center; justify-content:center;
}
#chartModal.show { display:flex; }
#modalBox {
  background:white; border-radius:12px; padding:28px 32px;
  width:740px; max-width:95vw; max-height:92vh;
  overflow-y:auto; position:relative; font-family:'맑은 고딕',sans-serif;
}
</style>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1A2D50">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="거래처지도">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<div id="topPanel">
  <input id="searchBox" type="text" placeholder="거래처 검색..." oninput="onSearch(this.value)">
  <select id="personSelect" onchange="onPersonSel()">
    <option value="">담당자 전체</option>
  </select>
  <span id="countBadge">160개</span>
</div>
<div id="searchDropdown"></div>

<div id="map"></div>
<div id="card"></div>

<div id="chartModal" onclick="if(event.target===this)closeChart()">
  <div id="modalBox">
    <button onclick="closeChart()"
      style="position:absolute;top:14px;right:18px;background:none;border:none;font-size:22px;cursor:pointer;color:#666;">&#10005;</button>
    <h3 id="chartTitle" style="margin:0 0 6px;font-size:17px;color:#333;"></h3>
    <p id="chartSub" style="margin:0 0 18px;font-size:13px;color:#888;"></p>
    <div style="margin-bottom:28px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <p style="font-weight:bold;font-size:13px;color:#555;margin:0;">월별 평가실적</p>
        <select id="evalProductSelect" onchange="updateEvalChart()"
          style="font-size:12px;border:1px solid #ddd;border-radius:4px;padding:3px 8px;cursor:pointer;max-width:160px;"></select>
      </div>
      <canvas id="evalChart" height="110"></canvas>
    </div>
    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <p style="font-weight:bold;font-size:13px;color:#555;margin:0;">최근3개월 품목별 실적</p>
        <select id="extraProductSelect" onchange="updateProductChart()"
          style="font-size:12px;border:1px solid #ddd;border-radius:4px;padding:3px 8px;cursor:pointer;max-width:160px;"></select>
      </div>
      <canvas id="productChart" height="260"></canvas>
    </div>
  </div>
</div>

// ── 지도 엔진: 카카오맵 우선(국내망 친화), 없으면 leaflet ──
const HAS_KAKAO = !!(window.kakao && window.kakao.maps && typeof window.kakao.maps.load === 'function');
let map = null, CVS = null, MapApi = null;
let markerObjs = [];

function dotStyle(d) {
  const color = COLOR_MAP[d.p] || '#888888';
  const size = Math.round(d.r * 2);
  return 'width:' + size + 'px;height:' + size + 'px;border-radius:50%;cursor:pointer;'
       + 'box-sizing:border-box;background:' + color + 'bf;border:1.5px solid ' + color + ';';
}

function buildKakaoEngine() {
  map = new kakao.maps.Map(document.getElementById('map'),
    {center:new kakao.maps.LatLng(37.5, 126.7), level:8});
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  return {
    name:'kakao',
    create(d) {
      const el = document.createElement('div');
      el.style.cssText = dotStyle(d);
      el.title = d.n;
      el.addEventListener('click', () => showInfo(d));
      return new kakao.maps.CustomOverlay({
        position:new kakao.maps.LatLng(d.y, d.x), content:el,
        xAnchor:0.5, yAnchor:0.5, clickable:true});
    },
    show(o) { o.marker.setMap(map); },
    hide(o) { o.marker.setMap(null); },
    focus(d) { map.setLevel(3); map.setCenter(new kakao.maps.LatLng(d.y, d.x)); },
    fitPts(pts) {
      const b = new kakao.maps.LatLngBounds();
      pts.forEach(p => b.extend(new kakao.maps.LatLng(p[0], p[1])));
      map.setBounds(b);
    },
    resize() { map.relayout(); },
  };
}

function buildLeafletEngine() {
  map = L.map('map', {center:[37.5,126.7], zoom:11, preferCanvas:true});
  const carto = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:19
  }).addTo(map);
  let swapped = false;
  carto.on('tileerror', () => {                 // CARTO 차단 시 OSM 으로 전환
    if (swapped) return;
    swapped = true;
    map.removeLayer(carto);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {attribution:'&copy; OpenStreetMap', maxZoom:19}).addTo(map);
  });
  CVS = L.canvas({padding:0.5});
  return {
    name:'leaflet',
    create(d) {
      const color = COLOR_MAP[d.p] || '#888888';
      const mk = L.circleMarker([d.y, d.x], {
        radius:d.r, color:color, fillColor:color,
        fillOpacity:0.75, weight:1.5, renderer:CVS,
      });
      mk.on('click', () => showInfo(d));
      return mk;
    },
    show(o) { o.marker.addTo(map); },
    hide(o) { map.removeLayer(o.marker); },
    focus(d) { map.setView([d.y, d.x], 15); },
    fitPts(pts) { map.fitBounds(pts, {padding:[50,50]}); },
    resize() { map.invalidateSize(); },
  };
}

function showInfo(d) {
  const c = document.getElementById('card');
  c.innerHTML =
    '<button class="cx" onclick="hideInfo()">&times;</button>'
    + '<b style="font-size:14px">' + d.n + '</b><br>'
    + '담당자: ' + d.p + '<br>'
    + '실적: ' + d.s.toLocaleString() + '<br>'
    + '기준월: ' + d.w
    + '<div style="margin-top:10px"><button onclick="hideInfo();openChart(''
    + d.n.replace(/\/g, '\\').replace(/'/g, "\'") + '')" '
    + 'style="width:100%;padding:7px 0;background:#4a90d9;color:#fff;border:none;'
    + 'border-radius:5px;cursor:pointer;font-size:12px;font-weight:bold">처방현황 보기</button></div>';
  c.classList.add('on');
}
function hideInfo() { document.getElementById('card').classList.remove('on'); }

function startMap(useKakao) {
  try {
    MapApi = useKakao ? buildKakaoEngine() : buildLeafletEngine();
  } catch (e) {
    MapApi = buildLeafletEngine();
  }
  MARKERS_DATA.forEach(d => {
    const o = {marker:MapApi.create(d), data:d, visible:true};
    MapApi.show(o);
    markerObjs.push(o);
  });
  setTimeout(() => MapApi.resize(), 250);
  window.addEventListener('resize', () => MapApi.resize());
  if (MapApi.name === 'kakao') {        // 카카오 타일이 안 깔리면 leaflet 으로 되돌림
    setTimeout(() => {
      if (document.getElementById('map').querySelectorAll('img').length === 0) {
        document.getElementById('map').innerHTML = '';
        markerObjs = [];
        MapApi = buildLeafletEngine();
        MARKERS_DATA.forEach(d => {
          const o = {marker:MapApi.create(d), data:d, visible:true};
          MapApi.show(o);
          markerObjs.push(o);
        });
        applyVisibility();
      }
    }, 3000);
  }
}

if (HAS_KAKAO) {
  let done = false;
  const go = ok => { if (done) return; done = true; startMap(ok); };
  try {
    kakao.maps.load(() => go(true));
    setTimeout(() => go(false), 6000);
  } catch (e) { go(false); }
} else {
  startMap(false);
}

// ── 담당자 선택 (dropdown) ──────────────────────────────────
let selectedPerson = '';

function onPersonSel() {
  selectedPerson = pSel.value;
  if (selectedPerson) {
    PERSONS.forEach(p => {
      toggleStates[p] = (p === selectedPerson);
      document.getElementById('btn_' + p).classList.toggle('off', !toggleStates[p]);
    });
  } else {
    PERSONS.forEach(p => {
      toggleStates[p] = true;
      document.getElementById('btn_' + p).classList.remove('off');
    });
  }
  applyVisibility();
  if (selectedPerson) {
    const pts = markerObjs
      .filter(o => o.data.p === selectedPerson)
      .map(o => [o.data.y, o.data.x]);
    if (pts.length) MapApi.fitPts(pts);
  }
}

// ── 토글 버튼 ──────────────────────────────────────────────
function togglePerson(p) {
  toggleStates[p] = !toggleStates[p];
  document.getElementById('btn_' + p).classList.toggle('off', !toggleStates[p]);
  pSel.value = '';
  selectedPerson = '';
  applyVisibility();
}

// ── 마커 표시/숨김 ─────────────────────────────────────────
function applyVisibility() {
  let cnt = 0;
  markerObjs.forEach(o => {
    const show = toggleStates[o.data.p];
    if (show && !o.visible) { MapApi.show(o); o.visible = true; }
    if (!show && o.visible) { MapApi.hide(o); o.visible = false; }
    if (show) cnt++;
  });
  countBadge.textContent = cnt + '개';
}

// ── 검색 ───────────────────────────────────────────────────
let searchTimer = null;
const dd = document.getElementById('searchDropdown');

function highlight(text, q) {
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return text;
  return text.slice(0,i) + '<b>' + text.slice(i, i+q.length) + '</b>' + text.slice(i+q.length);
}

function onSearch(val) {
  clearTimeout(searchTimer);
  if (!val.trim()) { dd.style.display='none'; return; }
  searchTimer = setTimeout(() => {
    const q = val.trim();
    const hits = markerObjs.filter(o => o.data.n.toLowerCase().includes(q.toLowerCase())).slice(0,20);
    if (!hits.length) { dd.style.display='none'; return; }
    dd.innerHTML = hits.map(o =>
      '<div class="searchItem" data-name="' + o.data.n.replace(/&/g,'&amp;').replace(/"/g,'&quot;') + '">' +
      highlight(o.data.n, q) +
      ' <span style="color:#999;font-size:11px;">' + o.data.p + '</span></div>'
    ).join('');
    dd.querySelectorAll('.searchItem').forEach(el => {
      el.addEventListener('click', () => selectPlace(el.dataset.name));
    });
    dd.style.display = 'block';
  }, 150);
}

function selectPlace(name) {
  const o = markerObjs.find(x => x.data.n === name);
  if (!o) return;
  document.getElementById('searchBox').value = name;
  dd.style.display = 'none';
  MapApi.focus(o.data);
  showInfo(o.data);
}

document.addEventListener('click', e => {
  if (!e.target.closest('#searchBox') && !e.target.closest('#searchDropdown'))
    dd.style.display = 'none';
});

const FIXED_PRODUCTS = ['로수바미브','아토바미브','자디앙F','에스글리토','트루셋저용량','트윈로우'];
const FIXED_RAW = new Set(['로수바미브','아토바미브정','아토바미브에이','자디앙','자디앙듀오','에스글리토','트루셋저용량','트윈로우']);

function getVal(prods, key) {
  if (!prods) return 0;
  if (key==='로수바미브')   return prods['로수바미브']||0;
  if (key==='아토바미브')   return prods['아토바미브정']||0;
  if (key==='자디앙F')      return (prods['자디앙']||0)+(prods['자디앙듀오']||0);
  if (key==='에스글리토')   return prods['에스글리토']||0;
  if (key==='트루셋저용량') return prods['트루셋저용량']||0;
  if (key==='트윈로우')     return prods['트윈로우']||0;
  return prods[key]||0;
}

function updateEvalChart() {
  const d = CHART_DATA[currentName]; if (!d) return;
  const sel = document.getElementById('evalProductSelect').value;
  const arr = sel==='_total' ? d.evals : d.months.map(m => getVal(d.products_by_month[m], sel));
  if (evalChart) evalChart.destroy();
  evalChart = new Chart(document.getElementById('evalChart'), {
    type:'bar',
    data:{
      labels:d.months,
      datasets:[{label:sel==='_total'?'평가실적':sel, data:arr, backgroundColor:'#4a90d9', borderRadius:4}]
    },
    options:{
      plugins:{legend:{display:false}, datalabels:{display:false}},
      scales:{y:{beginAtZero:true, ticks:{callback:v=>v.toLocaleString()}}}
    }
  });
}

function updateProductChart() {
  const d = CHART_DATA[currentName]; if (!d) return;
  const last3 = d.months.slice(-3);
  const latestM = d.months[d.months.length-1];
  const extraKey = document.getElementById('extraProductSelect').value;
  const labels = [...FIXED_PRODUCTS, extraKey||''];
  const latestVals = labels.map(k => getVal(d.products_by_month[latestM], k));
  const avgVals = labels.map(k => {
    const s = last3.reduce((a,m) => a + getVal(d.products_by_month[m], k), 0);
    return Math.round(s / (last3.length||1));
  });
  if (productChart) productChart.destroy();
  productChart = new Chart(document.getElementById('productChart'), {
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'최근월('+latestM+')', data:latestVals, backgroundColor:'#4a90d9', borderRadius:3},
        {label:'3개월 평균', data:avgVals, backgroundColor:'#f0a040', borderRadius:3},
      ]
    },
    options:{
      indexAxis:'y',
      plugins:{
        legend:{display:true, position:'top'},
        datalabels:{anchor:'end', align:'right', formatter:v=>v>0?v.toLocaleString():'', font:{size:10}, color:'#444'},
      },
      layout:{padding:{right:55}},
      scales:{x:{beginAtZero:true, ticks:{callback:v=>v.toLocaleString()}}}
    },
    plugins:[ChartDataLabels],
  });
}

function openChart(name) {
  const d = CHART_DATA[name]; if (!d) return;
  currentName = name;
  document.getElementById('chartTitle').textContent = name;
  document.getElementById('chartSub').textContent = '담당자: ' + d.person;

  const allKeys = new Set();
  d.months.forEach(m => Object.keys(d.products_by_month[m]||{}).forEach(k => allKeys.add(k)));

  const evalSel = document.getElementById('evalProductSelect');
  evalSel.innerHTML = '<option value="_total">전체 평가실적</option>';
  FIXED_PRODUCTS.forEach(p => {
    const o = document.createElement('option');
    o.value = p; o.textContent = p;
    evalSel.appendChild(o);
  });
  [...allKeys].filter(k => !FIXED_RAW.has(k)).sort().forEach(k => {
    const o = document.createElement('option');
    o.value = k; o.textContent = k;
    evalSel.appendChild(o);
  });

  const extraSel = document.getElementById('extraProductSelect');
  extraSel.innerHTML = '';
  [...allKeys].sort().forEach(k => {
    const o = document.createElement('option');
    o.value = k; o.textContent = k;
    extraSel.appendChild(o);
  });

  updateEvalChart();
  updateProductChart();
  document.getElementById('chartModal').classList.add('show');
}

function closeChart() {
  document.getElementById('chartModal').classList.remove('show');
  if (evalChart)   { evalChart.destroy();   evalChart=null; }
  if (productChart){ productChart.destroy(); productChart=null; }
}
</script>
</body>
</html>
