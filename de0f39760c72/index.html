<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#12131a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>가계부</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#12131a;--card:#1b1d27;--line:#282b38;--line2:#22242f;
 --ink:#fff;--ink2:#a8abbd;--ink3:#5f6376;--hi:#2a1f18;
 --up:#ff6b6b;--down:#2ecc8f;--bar:#eb6834;--bar2:#eda100;--bar3:#3987e5}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
 -webkit-font-smoothing:antialiased}
.wrap{max-width:540px;margin:0 auto;
 padding:calc(env(safe-area-inset-top) + 14px) 13px calc(env(safe-area-inset-bottom) + 40px)}
h1{font-size:18px;margin:0}
.sub{font-size:11px;color:var(--ink3);margin:2px 0 13px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:13px;
 scrollbar-width:none;-ms-overflow-style:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);
 border-radius:11px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
.tab.on{background:var(--bar);color:#fff;border-color:var(--bar)}
.tab i{display:block;font-style:normal;font-size:9.5px;font-weight:400;opacity:.65}
.head{background:var(--card);border-radius:16px;padding:15px;margin-bottom:12px}
.big{display:flex;justify-content:space-between;gap:6px;text-align:center}
.big>div{flex:1}
.big .l{font-size:10.5px;color:var(--ink3)}
.big .v{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums;margin:1px 0}
.big .d{font-size:10.5px;font-variant-numeric:tabular-nums}
.u{color:var(--up)} .d0{color:var(--down)} .z{color:var(--ink3)}
.rate{margin-top:13px;padding-top:12px;border-top:1px solid var(--line2)}
.rl{display:flex;justify-content:space-between;align-items:baseline;
 font-size:11.5px;color:var(--ink2)}
.rl b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.track{height:9px;background:var(--line2);border-radius:5px;position:relative;
 overflow:hidden;margin-top:7px}
.fill{height:100%;border-radius:5px}
.mark{position:absolute;top:-3px;bottom:-3px;left:66.6%;width:2px;background:var(--ink3)}
.warn{font-size:11.5px;margin-top:10px;padding:9px 10px;background:var(--hi);
 border-radius:9px;color:var(--ink2);line-height:1.45}
.mini{display:flex;gap:3px;align-items:flex-end;height:30px;margin-bottom:22px}
.mini div{flex:1;background:var(--line2);border-radius:3px 3px 0 0;position:relative}
.mini div.on{background:var(--bar)}
.mini span{position:absolute;bottom:-15px;left:0;right:0;text-align:center;
 font-size:9px;color:var(--ink3)}
h2{font-size:12.5px;margin:18px 0 7px;color:var(--ink2);
 display:flex;justify-content:space-between;align-items:baseline}
h2 b{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.grp{font-size:11px;color:var(--ink3);margin:14px 0 5px;
 display:flex;justify-content:space-between;align-items:baseline}
.grp b{color:var(--ink2);font-variant-numeric:tabular-nums;font-size:12px}
.list{background:var(--card);border-radius:13px;overflow:hidden}
.it+.it{border-top:1px solid var(--line2)}
.ih{display:grid;grid-template-columns:13px 1fr auto;gap:8px;align-items:center;
 padding:11px 13px;cursor:pointer}
.ar{font-size:9px;color:var(--ink3);transition:transform .15s}
.it.open .ar{transform:rotate(90deg)}
.nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm em{font-style:normal;color:var(--ink3);font-size:10px;margin-left:4px}
.rt{text-align:right}
.amt{font-size:13.5px;font-variant-numeric:tabular-nums;font-weight:600}
.dl{font-size:10.5px;font-variant-numeric:tabular-nums;display:block}
.bar{grid-column:2/4;height:3px;background:var(--line2);border-radius:2px;margin-top:-5px}
.bar i{display:block;height:100%;border-radius:2px}
.det{display:none;background:var(--bg)}
.it.open .det{display:block}
.tx{display:grid;grid-template-columns:38px 1fr auto;gap:8px;
 padding:7px 13px 7px 30px;font-size:11.5px;color:var(--ink2)}
.tx+.tx{border-top:1px solid var(--line2)}
.tx .dt{color:var(--ink3);font-variant-numeric:tabular-nums}
.tx .n0{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .a0{font-variant-numeric:tabular-nums;color:var(--ink)}
.foot{text-align:center;font-size:10px;color:var(--ink3);margin-top:24px;line-height:1.7}
/* 잠금 화면 */
#lock{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
 align-items:center;justify-content:center;padding:24px;z-index:99}
#lock.hide{display:none}
.lk{font-size:15px;color:var(--ink2);margin-bottom:20px}
.lk b{display:block;font-size:19px;color:var(--ink);margin-bottom:5px}
#pw{width:100%;max-width:270px;padding:14px 16px;font-size:17px;text-align:center;
 background:var(--card);border:1px solid var(--line);border-radius:13px;color:var(--ink);
 letter-spacing:.12em;outline:none}
#pw:focus{border-color:var(--bar)}
#go{width:100%;max-width:270px;margin-top:10px;padding:13px;font-size:15px;
 font-weight:600;background:var(--bar);color:#fff;border:0;border-radius:13px;
 cursor:pointer}
#go:disabled{opacity:.5}
#msg{font-size:12.5px;color:var(--up);height:18px;margin-top:11px}
.rem{display:flex;align-items:center;gap:7px;margin-top:15px;font-size:12.5px;
 color:var(--ink3);cursor:pointer}
.rem input{width:16px;height:16px;accent-color:var(--bar)}
#app{display:none} #app.on{display:block}

.pay{background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:16px 16px 6px;margin-bottom:14px}
.pay .t{font-size:12px;color:var(--ink3)}
.pay .v{font-size:27px;font-weight:700;letter-spacing:-.03em;
 font-variant-numeric:tabular-nums;margin:1px 0 0}
.pay .s{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;
 margin-bottom:10px}
.pay .pw{font-size:11.5px;background:var(--hi);color:var(--ink2);
 border-radius:8px;padding:8px 10px;margin:0 0 8px}
.pb{border-top:1px solid var(--line2)}
.pb>.ph{display:grid;grid-template-columns:13px 1fr auto;gap:8px;
 align-items:center;padding:10px 1px;cursor:pointer;user-select:none;
 font-size:13.5px}
.pb>.ph:hover{background:var(--line2)}
.pb .ar2{font-size:9px;color:var(--ink3);transition:transform .15s}
.pb.open .ar2{transform:rotate(90deg)}
.pb .pa{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.pb .pd{display:none;padding:0 1px 9px 21px}
.pb.open .pd{display:block}
.pr{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:12.5px;
 color:var(--ink2);padding:3.5px 0;border-bottom:1px solid var(--line2)}
.pr:last-child{border-bottom:0}
.pr .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .pv{font-variant-numeric:tabular-nums;color:var(--ink)}
.pr .pm{font-size:10.5px;color:var(--ink3);margin-left:6px}
.tg{font-size:10px;padding:1px 5px;border-radius:4px;background:var(--line2);
 color:var(--ink3);margin-left:6px;vertical-align:1px}
.tg.e{background:var(--hi);color:var(--up)}
.payfoot{font-size:11px;color:var(--ink3);border-top:1px solid var(--line2);
 padding:9px 1px 10px}

.pay{padding:14px 14px 4px}
.pay .v{font-size:24px}
.pb>.ph{font-size:13px;padding:9px 1px}
.pb .pa{font-size:13.5px}
.pr{font-size:12px}
.pr .pn{max-width:60vw}

 const B=[];
 B.push(['카드 '+(P['카드']||[]).length+'사', S['카드'],
  (P['카드']||[]).map(c=>[c['카드사']+'카드', c['금액'],
   (c['확정']?'':'추정 · ')+(c['근거']||''), !c['확정']])]);
 const L=P['주담대'];
 B.push(['주택담보대출 원리금', S['주담대'], L?[
   ['원금 (자산으로 남는 돈)', L['원금'], (L['회차']?L['회차']+'회차':''), !L['확정']],
   ['이자 (사라지는 돈)', L['이자'], L['근거']||'', !L['확정']],
   ['남은 잔액', L['잔액']||0, '참고', false]]:[]]);
 const F=(P['보험']||[]).map(x=>[x['항목'], x['금액'], x['출금일']+'일', false])
  .concat((P['연금저축']||[]).map(x=>[x['항목'], x['금액'], x['출금일']+'일', false]));
 B.push(['고정비 · 보험 '+(P['보험']||[]).length+'건 + 연금저축',
   S['보험']+S['연금저축'], F]);
 if((P['기타']||[]).length)B.push(['그 밖에 매월 나가는 자동이체', S['기타'],
   P['기타'].map(x=>[x['항목'], x['금액'],
     x['출금일']+'일'+(x['변동']>0.15?' · 달마다 다름':''), x['변동']>0.15])]);

 h+=B.map(b=>'<div class="pb"><div class="ph"><span class="ar2">&#9654;</span>'
  +'<span>'+b[0]+'</span><span class="pa">'+won(b[1])+'</span></div>'
  +'<div class="pd">'+b[2].map(r=>'<div class="pr"><span class="pn">'+r[0]
   +(r[2]?'<span class="pm">'+r[2]+'</span>':'')+'</span>'
   +'<span class="pv">'+won(r[1])+(r[3]?tag('추정',1):'')+'</span></div>').join('')
  +'</div></div>').join('');
 h+='<div class="payfoot">기준 '+P['기준일']+' · 카드 명세서와 주담대 카톡을 올리면 확정값으로 바뀐다</div>';
 return h+'</div>';
}

function bindPay(){
 document.querySelectorAll('.pb>.ph').forEach(el=>{
  el.onclick=()=>el.parentElement.classList.toggle('open');});
}

// ---- 잠금: 서버에는 암호문만 있다. 비번으로 그 자리에서 푼다 ----
const BOX=JSON.parse(document.getElementById('D').textContent);
const KEY='gagyebu-pw';
let D=null,MS,DAT,GO;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function unlock(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',
    false,['deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64(BOX.salt),iterations:BOX.iter,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BOX.iv)},
    key,b64(BOX.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function tryOpen(pw,remember){
  const msg=document.getElementById('msg'), go=document.getElementById('go');
  msg.textContent=''; go.disabled=true; go.textContent='여는 중...';
  try{
    D=await unlock(pw);
    if(remember)localStorage.setItem(KEY,pw);
    MS=D.months;DAT=D.data;GO=D.grade_of;
    cur=MS.filter(m=>DAT[m]['완전']).pop()||MS[MS.length-1];
    document.getElementById('lock').classList.add('hide');
    document.getElementById('app').classList.add('on');
    render();
    return true;
  }catch(e){
    localStorage.removeItem(KEY);
    msg.textContent='비밀번호가 맞지 않습니다';
    document.getElementById('pw').value='';
    return false;
  }finally{ go.disabled=false; go.textContent='열기'; }
}

function openPlain(){
  D=BOX.plain;MS=D.months;DAT=D.data;GO=D.grade_of;
  cur=MS.filter(m=>DAT[m]['완전']).pop()||MS[MS.length-1];
  document.getElementById('lock').classList.add('hide');
  document.getElementById('app').classList.add('on');
  render();
}

window.addEventListener('DOMContentLoaded',()=>{
  if(BOX.plain){openPlain();return;}
  const pw=document.getElementById('pw'), go=document.getElementById('go');
  go.onclick=()=>tryOpen(pw.value,document.getElementById('rem').checked);
  pw.addEventListener('keydown',e=>{if(e.key==='Enter')go.click();});
  document.getElementById('lockout').onclick=e=>{
    e.preventDefault();localStorage.removeItem(KEY);location.reload();};
  const saved=localStorage.getItem(KEY);
  if(saved)tryOpen(saved,true).then(ok=>{if(!ok)pw.focus();});
  else pw.focus();
});

let cur=null;
const won=n=>Math.round(n).toLocaleString('ko-KR');
const man=n=>{const a=Math.abs(n);
 if(a>=100000000)return (n/100000000).toFixed(1)+'억';
 if(a>=10000)return Math.round(n/10000).toLocaleString('ko-KR')+'만';
 return won(n);};
// cur 는 위(잠금 해제 시점)에서 이미 선언·설정한다. 여기서 또 선언하면
// 'Identifier cur has already been declared' 로 스크립트 전체가 죽는다.
const prevOf=m=>{const i=MS.indexOf(m);return i>0?MS[i-1]:null;};
function delta(n,b){if(b===null||b===undefined)return['','z'];
 const d=n-b;if(Math.abs(d)<1)return['0','z'];
 return[(d>0?'+':'')+man(d),d>0?'u':'d0'];}

function tabs(){document.getElementById('tabs').innerHTML=MS.map(m=>{
 const d=DAT[m];return `<button class="tab${m===cur?' on':''}" data-m="${m}">
 ${+m.slice(5)}월<i>${d['완전']?d['일수']+'일':d['기간']+' *'}</i></button>`;}).join('');
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cur=b.dataset.m;
  render();window.scrollTo({top:0,behavior:'smooth'});});}

function rows(obj,det,prev,color){
 const ks=Object.keys(obj).filter(k=>Math.abs(obj[k])>0.5).sort((a,b)=>obj[b]-obj[a]);
 if(!ks.length)return '<div class="list"><div class="tx" style="padding-left:13px">'+
  '<span></span><span class="n0">내역 없음</span><span></span></div></div>';
 const mx=Math.max(...ks.map(k=>obj[k]));
 return '<div class="list">'+ks.map(k=>{
  const v=obj[k],tx=det[k]||[],[dt,dc]=delta(v,prev?(prev[k]||0):null);
  return `<div class="it"><div class="ih">
   <span class="ar">&#9654;</span>
   <span class="nm">${k}<em>${tx.length}</em></span>
   <span class="rt"><span class="amt">${won(v)}</span>
    <span class="dl ${dc}">${dt}</span></span>
   <span class="bar"><i style="width:${(100*v/mx).toFixed(1)}%;
    background:var(--${color})"></i></span></div>
   <div class="det">${tx.map(t=>`<div class="tx"><span class="dt">${t[0]}</span>
    <span class="n0">${t[1]}</span><span class="a0">${won(t[2])}</span></div>`).join('')}
   </div></div>`;}).join('')+'</div>';}

function render(){
 const pe=document.getElementById('pay');
 if(D.pay&&pe&&!pe.dataset.on){pe.innerHTML=payHTML(D.pay);pe.dataset.on='1';bindPay();}
 const d=DAT[cur],p=prevOf(cur),pd=p?DAT[p]:null;
 document.getElementById('sub').textContent=cur+' · '+d['기간']+
  (d['완전']?'':' · 부분월');
 tabs();
 const[i1,c1]=delta(d['수입합'],pd?pd['수입합']:null);
 const[s1,c2]=delta(d['소비합'],pd?pd['소비합']:null);
 const[b1,c3]=delta(d['수지'],pd?pd['수지']:null);
 const rate=d['소비율'],over=rate>100;
 let h=`<div class="head"><div class="big">
  <div><div class="l">수입</div><div class="v">${man(d['수입합'])}</div>
   <div class="d ${c1==='u'?'d0':'u'}">${i1}</div></div>
  <div><div class="l">소비</div><div class="v">${man(d['소비합'])}</div>
   <div class="d ${c2}">${s1}</div></div>
  <div><div class="l">수지</div>
   <div class="v" style="color:var(--${d['수지']<0?'up':'down'})">${man(d['수지'])}</div>
   <div class="d ${c3==='u'?'d0':'u'}">${b1}</div></div></div>
  <div class="rate"><div class="rl"><span>수입 대비 소비</span>
   <b style="color:var(--${over?'up':'down'})">${rate.toFixed(0)}%</b></div>
  <div class="track"><div class="fill" style="width:${Math.min(rate/150*100,100)}%;
   background:var(--${over?'up':'down'})"></div><div class="mark"></div></div>
  <div class="rl" style="margin-top:5px"><span style="font-size:10px">선이 100%</span>
   <span style="font-size:10px">${pd?'전월 '+pd['소비율'].toFixed(0)+'%':''}</span></div>`;
 if(pd&&d['완전']&&pd['완전']){
  const di=d['수입합']-pd['수입합'];
  const df=(d['등급']['내가 정하는 돈']||0)-(pd['등급']['내가 정하는 돈']||0);
  if(di>0&&df>0)h+=`<div class="warn">수입이 ${man(di)} 늘었는데
   <b>내가 정하는 돈도 ${man(df)} 늘었다.</b></div>`;
  else if(df<0)h+=`<div class="warn">내가 정하는 돈이
   <b>${man(-df)} 줄었다.</b></div>`;}
 h+='</div>';
 const mx=Math.max(...MS.map(m=>DAT[m]['소비합']));
 h+='<div class="mini">'+MS.map(m=>`<div class="${m===cur?'on':''}"
  style="height:${Math.max(100*DAT[m]['소비합']/mx,4)}%"><span>${+m.slice(5)}</span>
  </div>`).join('')+'</div>';
 h+=`<h2><span>수입</span><b>${won(d['수입합'])}</b></h2>`;
 h+=rows(d['수입'],d['수입내역'],pd?pd['수입']:null,'bar3');
 const byG={};Object.keys(d['소비']).forEach(k=>{
  const g=GO[k]||'내가 정하는 돈';(byG[g]=byG[g]||{})[k]=d['소비'][k];});
 h+=`<h2><span>소비</span><b>${won(d['소비합'])}</b></h2>`;
 const col={'내가 정하는 돈':'bar','줄이기 어려운 돈':'bar2','못 줄이는 돈':'bar3'};
 D.grades.forEach(g=>{if(!byG[g])return;
  const t=Object.values(byG[g]).reduce((a,b)=>a+b,0);
  const pt=pd?Object.keys(pd['소비']).filter(k=>(GO[k]||'')===g)
   .reduce((a,k)=>a+pd['소비'][k],0):null;
  const[dt,dc]=delta(t,pt);
  h+=`<div class="grp"><span>${g}</span><span><b>${won(t)}</b>
   <span class="dl ${dc}" style="display:inline;margin-left:7px">${dt}</span></span></div>`;
  const pg={};if(pd)Object.keys(pd['소비']).forEach(k=>{
   if((GO[k]||'')===g)pg[k]=pd['소비'][k];});
  h+=rows(byG[g],d['소비내역'],pd?pg:null,col[g]||'bar');});
 if(byG['소비 아님(자산)']){
  const t=Object.values(byG['소비 아님(자산)']).reduce((a,b)=>a+b,0);
  h+=`<div class="grp"><span>자산으로 남는 돈</span><span><b>${won(t)}</b></span></div>`;
  h+=rows(byG['소비 아님(자산)'],d['소비내역'],null,'bar3');}
 document.getElementById('view').innerHTML=h;
 document.querySelectorAll('.ih').forEach(el=>el.onclick=()=>
  el.parentElement.classList.toggle('open'));}
if('serviceWorker' in navigator)window.addEventListener('load',()=>
 navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
