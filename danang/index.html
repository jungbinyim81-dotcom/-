<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#fff;--ink:#1a1a1a;--sub:#666;--line:#e5e5e5;--card:#fafafa;--red:#BA0C2F}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:12px 16px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:18px}h1 b{color:var(--red)}
header p{margin:4px 0 0;font-size:12px;color:var(--sub)}
#wrap{display:flex;height:calc(100vh - 62px)}#map{flex:1}#side{width:400px;overflow:auto;border-left:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}.chip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.row{display:flex;gap:12px;align-items:flex-start}.row>div{flex:1;min-width:0}
.ph{flex:none;width:92px;height:92px;border-radius:10px;object-fit:cover;background:#eee}
.pimg{width:100%;height:150px;object-fit:cover;border-radius:8px;margin-bottom:6px;display:block}
.card{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}.card:hover,.card.sel{background:var(--card)}
.card h3{margin:0 0 3px;font-size:15px;display:flex;align-items:center;gap:7px}
.no{flex:none;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.menu{font-size:13px;font-weight:600;margin:3px 0}.desc{font-size:12.5px;color:#333;line-height:1.5}
.meta{font-size:11.5px;color:var(--sub);margin-top:5px}.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:#FDECEF;color:var(--red);font-weight:600}
.cash{background:#FFF4E5;color:#B45309}
.links{margin-top:7px;display:flex;gap:6px}.links a{font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 9px;color:var(--ink);background:#fff}
.links a.g{background:#1a73e8;color:#fff;border-color:#1a73e8}
.pin{width:26px;height:26px;border-radius:50%;color:#fff;font:700 12px sans-serif;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.pk{outline:3px solid #FFD54F}
.leaflet-popup-content{margin:10px 12px;font-family:inherit}
#me{position:absolute;z-index:500;right:10px;bottom:24px;background:#fff;border:1px solid #ccc;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2)}
html,body{overflow-x:hidden;max-width:100vw}#side,.card,.desc,.meta{min-width:0;overflow-wrap:anywhere}
@media(max-width:760px){header{padding:10px 16px}#wrap{flex-direction:column;height:auto;width:100vw}#map{height:55vh;flex:none;position:sticky;top:0;z-index:3}#side{width:100%;border:0}#me{position:fixed;top:calc(55vh - 50px);bottom:auto}}
</style></head><body>

function chips(){

}

   <div class="menu">${esc(d.menu)}</div></div></div><div class="desc" style="margin-top:6px">${esc(d.desc)}</div>
   <div class="meta">${d.cat} · ${d.price}${d.pick?' · <span class="tag">추천</span>':''}${d.cash?' · <span class="tag cash">현금만</span>':''}<br>${esc(d.addr)}${d.tel?' · <a href="tel:'+d.tel.replace(/\s/g,'')+'">'+d.tel+'</a>':''}</div>
   <div class="links"><a class="g" href="${gdir(d)}" target="_blank">길찾기</a><a href="${gmap(d)}" target="_blank">구글지도</a><a href="${d.url}" target="_blank">미쉐린</a></div></div>`).join('');
  document.querySelectorAll('.card').forEach(e=>e.onclick=ev=>{if(ev.target.tagName!=='A')sel(+e.dataset.i,true)});
  if(v.length) map.fitBounds(L.latLngBounds(v.map(d=>[d.lat,d.lng])),{padding:[30,30]});
}
function sel(i,fly){
  document.querySelectorAll('.card.sel').forEach(e=>e.classList.remove('sel'));
  const c=document.getElementById('c'+(i+1)); if(c){c.classList.add('sel'); if(!fly)c.scrollIntoView({behavior:'smooth',block:'nearest'});}
  if(fly){map.setView([D[i].lat,D[i].lng],17); mk[i].openPopup(); if(innerWidth<=760)scrollTo({top:0,behavior:'smooth'});}
}
let meM=null;
document.getElementById('me').onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{
  const ll=[p.coords.latitude,p.coords.longitude];
  meM?meM.setLatLng(ll):meM=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#1a73e8',fillOpacity:1}).addTo(map);
  map.setView(ll,15);},()=>alert('위치 권한을 허용해 주세요'));
draw();
</script></body></html>
