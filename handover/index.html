<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>박준상 인수인계 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --navy:#0F2E76; --green:#008C32; --orange:#FA4100;
  --deal:#ff7f0e; --none:#78838f; --memo:#0F2E76;
  --bg:#f4f6f9; --card:#fff; --ink:#1b2330; --ink2:#5a6676; --line:#e3e8ef;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Malgun Gothic','맑은 고딕',system-ui,sans-serif;background:var(--bg);color:var(--ink);
     display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header,.tools{flex:none}
#stage{position:relative;flex:1;display:flex;min-height:0}
header{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:16px;font-weight:700;letter-spacing:-.3px}
header .sub{font-size:11px;opacity:.75}
.chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.14);border-radius:20px;padding:4px 10px;font-size:11px;white-space:nowrap}
.chip b{font-size:13px}
.tools{background:var(--card);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:8px;
       align-items:center;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tools>*{flex:none}
#warn{display:none;background:#fdf0e8;color:#8a3b10;border-bottom:1px solid #f3c4b3;padding:7px 14px;font-size:12px;flex:none}
select,input[type=text],button{font-family:inherit;font-size:12px;border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:#fff;color:var(--ink)}
button{cursor:pointer}
button.primary{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
button.ghost{background:#fff}
button.danger{background:#fff;color:var(--orange);border-color:#f3c4b3}
#map{flex:1;min-width:0;min-height:240px}
.legend{position:absolute;right:10px;bottom:22px;z-index:600;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:11px;line-height:1.7;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.lp{font-size:12px;line-height:1.55;min-width:210px}
.lp b{font-size:13px}
.lp .tag{display:inline-block;background:#eef2f8;color:var(--navy);border-radius:4px;padding:1px 6px;font-size:10px;margin-left:4px}
.lp .row{color:var(--ink2);margin-top:3px}
.lp .btns{display:flex;gap:5px;margin-top:8px}
.lp .btns button{flex:1;padding:6px 4px;font-size:11px;font-weight:700}
/* 목록 패널 (지도와 나란히) */
#panel{width:320px;flex:none;background:var(--card);border-right:1px solid var(--line);z-index:700;display:none;flex-direction:column;min-height:0}
#panel.on{display:flex}
#panel .ph{padding:9px 11px;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center}
#panel .ph input{flex:1}
#list{overflow:auto;flex:1}
.li{padding:9px 11px;border-bottom:1px solid #f1f4f8;cursor:pointer}
.li:hover{background:#f7f9fc}
.li .n{font-size:12.5px;font-weight:700}
.li .m{font-size:11px;color:var(--ink2);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.li .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
/* 모달 */
.mask{position:fixed;inset:0;background:rgba(14,22,40,.55);z-index:1200;display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.mask.on{display:flex}
.modal{background:var(--card);border-radius:14px;width:min(860px,100%);box-shadow:0 18px 50px rgba(0,0,0,.28);overflow:hidden}
.mh{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.mh h2{font-size:15.5px}
.mh .x{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:7px;width:30px;height:30px;font-size:15px;cursor:pointer;color:var(--ink2)}
.tabs{display:flex;gap:4px;padding:9px 12px 0;border-bottom:1px solid var(--line);background:#fbfcfe}
.tab{padding:7px 13px;font-size:12.5px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:#f1f4f8;cursor:pointer;color:var(--ink2)}
.tab.on{background:#fff;color:var(--navy);font-weight:700;box-shadow:inset 0 2px 0 var(--navy)}
.pane{display:none;padding:14px 16px 18px}
.pane.on{display:block}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.kpi{background:#f7f9fc;border:1px solid var(--line);border-radius:9px;padding:8px 12px;min-width:104px}
.kpi .l{font-size:10.5px;color:var(--ink2)}
.kpi .v{font-size:16px;font-weight:700;margin-top:2px}
.sec{font-size:12px;font-weight:700;color:var(--navy);margin:14px 0 7px}
.selrow{display:flex;gap:7px;align-items:center;margin:0 0 7px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 7px;border-bottom:1px solid #eef1f6;text-align:right;white-space:nowrap}
th{background:#f7f9fc;color:var(--ink2);font-weight:700;font-size:11px;position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
.tw{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:9px}
.pcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.pcard .pn{font-size:13px;font-weight:700}
.pcard .pa{font-size:11.5px;color:var(--ink2);margin-top:2px}
.pcard .bs{margin-left:auto;background:#eef2f8;color:var(--navy);border-radius:5px;padding:2px 7px;font-size:10.5px;white-space:nowrap}
.pcard a{color:var(--green);text-decoration:none;font-weight:700;font-size:12px}
textarea{width:100%;min-height:230px;border:1px solid var(--line);border-radius:10px;padding:11px;font-family:inherit;font-size:13px;line-height:1.65;resize:vertical}
.memobar{display:flex;gap:7px;align-items:center;margin-top:9px;flex-wrap:wrap}
.memobar .st{font-size:11px;color:var(--ink2);margin-left:auto}
.hint{font-size:11px;color:var(--ink2);line-height:1.6;margin-bottom:8px}
.tpl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tpl button{font-size:11px;padding:4px 8px;background:#f7f9fc}
.empty{color:var(--ink2);font-size:12.5px;padding:18px 0;text-align:center}
@media (max-width:640px){
  #panel{position:absolute;left:0;top:0;bottom:0;width:100%}
  .modal{border-radius:12px}
  header h1{font-size:14.5px}
  header .sub{display:none}
}
</style>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0F2E76">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="인수인계지도">
  <link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
<header>
  <div>
    <h1>박준상 대리 인수인계 지도</h1>
    <div class="sub">담당지역 개원처 · 처방실적 · 문전약국 · 인수인계 메모</div>
  </div>
  <div class="chips">
    <span class="chip">개원처 <b id="cHosp">0</b></span>
    <span class="chip">거래처 <b id="cDeal">0</b></span>
    <span class="chip">메모 <b id="cMemo">0</b></span>
  </div>
</header>

<div class="tools">
  <button class="ghost" onclick="togglePanel()">목록</button>
  <select id="fDong" onchange="render()"><option value="">동 전체</option></select>
  <select id="fSpec" onchange="render()"><option value="">과 전체</option></select>
  <select id="fKind" onchange="render()">
    <option value="">전체</option>
    <option value="deal">거래처만</option>
    <option value="none">미거래 개원처만</option>
    <option value="memo">메모 작성분만</option>
  </select>
  <input type="text" id="fQ" placeholder="병원명 검색" oninput="render()" style="width:130px">
  <button class="ghost" onclick="exportMemo()">메모 내보내기</button>
  <button class="ghost" onclick="document.getElementById('imp').click()">불러오기</button>
  <input type="file" id="imp" accept=".json" style="display:none" onchange="importMemo(this)">
  <button class="primary" onclick="openAllMemo()">인수인계 전체보기</button>
</div>

<div id="warn"></div>
<div id="stage">
  <div id="panel">
    <div class="ph"><input type="text" id="pq" placeholder="목록 내 검색" oninput="renderList()"><button class="ghost" onclick="togglePanel()">닫기</button></div>
    <div id="list"></div>
  </div>
  <div id="map"></div>
  <div class="legend">
    <div><i style="background:#ff7f0e"></i>거래처(실적 있음)</div>
    <div><i style="background:#78838f"></i>미거래 개원처</div>
    <div><i style="background:#fff;border:2.5px solid #0F2E76"></i>인수인계 메모 있음</div>
  </div>
</div>

<div class="mask" id="mask" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="mh">
      <h2 id="mTitle"></h2>
      <button class="x" onclick="closeModal()">&times;</button>
    </div>
    <div class="tabs">
      <div class="tab on" data-p="perf" onclick="tab('perf')">실적 · 품목</div>
      <div class="tab" data-p="ph" onclick="tab('ph')">문전약국</div>
      <div class="tab" data-p="memo" onclick="tab('memo')">인수인계 메모</div>
      <div class="tab" data-p="info" onclick="tab('info')">기본정보</div>
    </div>
    <div class="pane on" id="pane-perf"></div>
    <div class="pane" id="pane-ph"></div>
    <div class="pane" id="pane-memo"></div>
    <div class="pane" id="pane-info"></div>
  </div>
</div>

  h.push('<div class="btns">'
    + '<button onclick="openModal(\''+js(d.n)+'\',\'perf\')">실적</button>'
    + '<button onclick="openModal(\''+js(d.n)+'\',\'ph\')">약국</button>'
    + '<button onclick="openModal(\''+js(d.n)+'\',\'memo\')">인수인계</button></div>');
  h.push('</div>');
  mk.bindPopup(h.join(''), {maxWidth:320}).openPopup();
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function js(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

/* ── 필터 / 렌더 ── */
(function initFilters(){
  const dongs = [...new Set(DATA.items.map(d=>d.dong).filter(Boolean))].sort();
  const specs = [...new Set(DATA.items.map(d=>d.spec).filter(Boolean))].sort();
  const fd = document.getElementById('fDong'), fs = document.getElementById('fSpec');
  dongs.forEach(v=>fd.insertAdjacentHTML('beforeend','<option>'+esc(v)+'</option>'));
  specs.forEach(v=>fs.insertAdjacentHTML('beforeend','<option>'+esc(v)+'</option>'));
})();

function visible(){
  const dong = document.getElementById('fDong').value;
  const spec = document.getElementById('fSpec').value;
  const kind = document.getElementById('fKind').value;
  const q = document.getElementById('fQ').value.trim();
  return DATA.items.filter(d => {
    if (dong && d.dong !== dong) return false;
    if (spec && d.spec !== spec) return false;
    if (kind === 'deal' && d.tot <= 0) return false;
    if (kind === 'none' && d.tot > 0) return false;
    if (kind === 'memo' && !hasMemo(d.n)) return false;
    if (q && d.n.indexOf(q) < 0) return false;
    return true;
  });
}

function render(){
  const vis = new Set(visible().map(d=>d.n));
  Object.values(markers).forEach(o => {
    const want = vis.has(o.d.n);
    if (want && !o.on) { o.mk.addTo(map); o.on = true; }
    if (!want && o.on) { map.removeLayer(o.mk); o.on = false; }
    if (want) o.mk.setStyle(styleOf(o.d));
  });
  const memoCnt = DATA.items.filter(d=>hasMemo(d.n)).length;
  document.getElementById('cHosp').textContent = vis.size;
  document.getElementById('cDeal').textContent = visible().filter(d=>d.tot>0).length;
  document.getElementById('cMemo').textContent = memoCnt;
  renderList();
}

function togglePanel(){ document.getElementById('panel').classList.toggle('on'); renderList(); }
function renderList(){
  const q = document.getElementById('pq').value.trim();
  const rows = visible().filter(d=>!q || d.n.indexOf(q)>=0);
  const h = rows.map(d => {
    const col = d.tot>0 ? '#ff7f0e' : '#78838f';
    return '<div class="li" onclick="focusOn(\''+js(d.n)+'\')">'
      + '<div class="n"><span class="dot" style="background:'+col+'"></span>'+esc(d.n)+(d.out?' <span class="tag">지역밖</span>':'')+'</div>'
      + '<div class="m"><span>'+esc(d.dong)+'</span><span>'+esc(d.spec)+'</span>'
      + (d.tot>0 ? '<span>3개월평균 '+fmt(d.avg3)+'</span>' : '<span>미거래</span>')
      + (hasMemo(d.n) ? '<span style="color:#0F2E76;font-weight:700">메모</span>' : '')
      + '</div></div>';
  }).join('');
  document.getElementById('list').innerHTML = h || '<div class="empty">해당 조건 없음</div>';
}
function focusOn(n){
  const o = markers[n];
  if(!o){ openModal(n, 'perf'); return; }   // 지도 없을 때는 바로 상세 모달
  if(!o.on){ o.mk.addTo(map); o.on = true; }
  map.setView([o.d.lat, o.d.lng], 16);
  popup(o.d, o.mk);
}

/* ── 모달 ── */
let CUR = null, chEval = null, chProd = null;
function openModal(n, pane){
  CUR = DATA.items.find(d=>d.n===n);
  if(!CUR) return;
  document.getElementById('mTitle').textContent = CUR.n;
  document.getElementById('mask').classList.add('on');
  buildPerf(); buildPh(); buildMemo(); buildInfo();
  tab(pane||'perf');
}
function closeModal(){
  document.getElementById('mask').classList.remove('on');
  if(chEval){chEval.destroy();chEval=null;} if(chProd){chProd.destroy();chProd=null;}
  render();
}
function tab(p){
  if(!CUR && p!=='memo'){ alert('지도나 목록에서 거래처를 먼저 선택해주세요.'); return; }
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.p===p));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
  document.getElementById('pane-'+p).classList.add('on');
  if(p==='perf'){ drawEval(); drawProd(); }
}

/* 실적 · 품목 */
function buildPerf(){
  const d = CUR, el = document.getElementById('pane-perf');
  if (d.tot <= 0){
    el.innerHTML = '<div class="empty">처방실적 데이터가 없는 개원처입니다.<br>'
      + '(거래처처방현황에 등록되면 자동으로 실적이 표시됩니다)</div>';
    return;
  }
  const prods = Object.keys(d.prod).sort((a,b)=>sumOf(d.prod[b])-sumOf(d.prod[a]));
  const last = MONTHS[MONTHS.length-1];
  const noChart = (typeof Chart === 'undefined');
  let h = '';
  h += '<div class="kpis">'
     + kpi(last+' 평가실적', fmt(d.ev[last]||0))
     + kpi('최근 3개월 평균', fmt(d.avg3))
     + kpi('처방품목 수', prods.length)
     + kpi('근거자료', esc(d.src||'-'))
     + '</div>';
  h += '<div class="sec">월별 평가실적 (전체 기간)</div>';
  h += noChart ? monthTable(d.ev) : '<canvas id="cvEval" height="108"></canvas>';
  if (!noChart) {
    h += '<div class="sec">품목별 월 추이</div>';
    h += '<div class="selrow"><select id="selProd" onchange="drawProd()">'
       + prods.map(p=>'<option>'+esc(p)+'</option>').join('') + '</select>'
       + '<span style="font-size:11px;color:#5a6676">누계 상위 순</span></div>';
    h += '<canvas id="cvProd" height="108"></canvas>';
  }
  h += '<div class="sec">전체 품목 실적</div>';
  h += '<div class="tw"><table><thead><tr><th>품목</th><th>'+last+'</th><th>3개월평균</th><th>누계</th></tr></thead><tbody>';
  prods.forEach(p=>{
    const s = d.prod[p];
    const cur = s[last]||0;
    const a3 = Math.round(MONTHS.slice(-3).reduce((t,m)=>t+(s[m]||0),0)/3);
    h += '<tr><td>'+esc(p)+'</td><td>'+fmt(cur)+'</td><td>'+fmt(a3)+'</td><td>'+fmt(sumOf(s))+'</td></tr>';
  });
  h += '</tbody></table></div>';
  el.innerHTML = h;
}
function kpi(l,v){ return '<div class="kpi"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>'; }
function sumOf(o){ return Object.values(o).reduce((a,b)=>a+b,0); }
/* 차트 라이브러리가 차단됐을 때 월별 실적을 표로 대체 */
function monthTable(ev){
  return '<div class="tw" style="max-height:200px"><table><thead><tr><th>년월</th><th>평가실적</th></tr></thead><tbody>'
    + MONTHS.map(m=>'<tr><td>'+m+'</td><td>'+fmt(ev[m]||0)+'</td></tr>').join('')
    + '</tbody></table></div>';
}

function drawEval(){
  const c = document.getElementById('cvEval'); if(!c || !CUR || typeof Chart === 'undefined') return;
  if(chEval) chEval.destroy();
  chEval = new Chart(c, {
    type:'bar',
    data:{labels:MONTHS, datasets:[{label:'평가실적', data:MONTHS.map(m=>CUR.ev[m]||0),
      backgroundColor:C_EVAL, borderRadius:4, borderSkipped:'bottom', maxBarThickness:22}]},
    options:{responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>fmt(c.parsed.y)}}},
      scales:{y:{beginAtZero:true, grid:{color:'#eef1f6'}, ticks:{font:{size:10}, callback:v=>fmt(v)}},
              x:{grid:{display:false}, ticks:{font:{size:9}, maxRotation:60, minRotation:0}}}}
  });
}
function drawProd(){
  const c = document.getElementById('cvProd'); if(!c || !CUR || typeof Chart === 'undefined') return;
  const sel = document.getElementById('selProd'); if(!sel) return;
  const s = CUR.prod[sel.value] || {};
  if(chProd) chProd.destroy();
  chProd = new Chart(c, {
    type:'line',
    data:{labels:MONTHS, datasets:[{label:sel.value, data:MONTHS.map(m=>s[m]||0),
      borderColor:C_AVG, backgroundColor:'rgba(255,127,14,.14)', borderWidth:2,
      pointRadius:3, pointHoverRadius:5, tension:.25, fill:true}]},
    options:{responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>fmt(c.parsed.y)}}},
      scales:{y:{beginAtZero:true, grid:{color:'#eef1f6'}, ticks:{font:{size:10}, callback:v=>fmt(v)}},
              x:{grid:{display:false}, ticks:{font:{size:9}}}}}
  });
}

/* 문전약국 */
function buildPh(){
  const d = CUR, el = document.getElementById('pane-ph');
  if(!d.ph.length){
    el.innerHTML = '<div class="empty">문전약국 매칭 정보가 없습니다.<br>(요양병원·보건소는 심평원 매칭리스트에 약국이 없습니다)</div>';
    return;
  }
  let h = '<div class="hint">병원약국매칭리스트 기준 · 매칭근거(같은건물 &gt; 인근 &gt; 같은우편번호) 순</div>';
  d.ph.forEach(p=>{
    h += '<div class="pcard"><div><div class="pn">'+esc(p.n)+'</div>'
       + '<div class="pa">'+esc(p.addr)+'</div>'
       + (p.tel ? '<div style="margin-top:4px"><a href="tel:'+esc(p.tel)+'">☎ '+esc(p.tel)+'</a></div>' : '')
       + '</div><div class="bs">'+esc(p.basis||'-')+'</div></div>';
  });
  el.innerHTML = h;
}

/* 인수인계 메모 */
const TPL = [
  ['키맨/원장 성향', '■ 키맨/원장 성향: '],
  ['방문 요령·시간', '■ 방문 요령·시간: '],
  ['처방 현황·경쟁', '■ 처방 현황·경쟁품목: '],
  ['문전약국 관계', '■ 문전약국 관계: '],
  ['주의사항', '■ 주의사항: '],
];
function buildMemo(){
  const d = CUR, el = document.getElementById('pane-memo');
  const m = MEMO[d.n] || {};
  let h = '<div class="hint">이 기기(브라우저)에 저장됩니다. 다른 기기로 옮길 때는 상단 <b>메모 내보내기</b>로 JSON을 저장해 <b>불러오기</b> 하세요.</div>';
  h += '<div class="tpl">' + TPL.map((t,i)=>'<button onclick="insTpl('+i+')">+ '+t[0]+'</button>').join('') + '</div>';
  h += '<textarea id="memoBox" placeholder="인수인계 내용을 적어주세요.">'+esc(m.text||'')+'</textarea>';
  h += '<div class="memobar"><button class="primary" onclick="saveMemo()">저장</button>'
     + '<button class="ghost" onclick="copyMemo()">복사</button>'
     + '<button class="danger" onclick="delMemo()">삭제</button>'
     + '<span class="st" id="memoSt">'+(m.at ? '마지막 저장 '+esc(m.at) : '아직 저장된 메모 없음')+'</span></div>';
  el.innerHTML = h;
}
function insTpl(i){
  const box = document.getElementById('memoBox');
  const t = TPL[i][1];
  box.value = (box.value.trim() ? box.value.replace(/\s*$/,'') + '\n' : '') + t;
  box.focus(); box.selectionStart = box.selectionEnd = box.value.length;
}
function saveMemo(){
  const txt = document.getElementById('memoBox').value;
  const at = new Date().toLocaleString('ko-KR',{dateStyle:'short',timeStyle:'short'});
  MEMO[CUR.n] = {text:txt, at:at};
  if(!txt.trim()) delete MEMO[CUR.n];
  if(saveStore()){
    document.getElementById('memoSt').textContent = txt.trim() ? '마지막 저장 '+at : '메모 삭제됨';
    render();
  }
}
function copyMemo(){
  const t = '['+CUR.n+']\n' + document.getElementById('memoBox').value;
  navigator.clipboard.writeText(t).then(()=>{ document.getElementById('memoSt').textContent='클립보드에 복사됨'; });
}
function delMemo(){
  if(!confirm(CUR.n+' 메모를 삭제할까요?')) return;
  delete MEMO[CUR.n]; saveStore();
  document.getElementById('memoBox').value = '';
  document.getElementById('memoSt').textContent = '삭제됨';
  render();
}

/* 기본정보 */
function buildInfo(){
  const d = CUR;
  const r = [['구분', d.out?'담당지역 밖 거래처':'담당지역 개원처'],
             ['지역', d.region+' '+d.dong], ['과', d.spec], ['종별', d.jong],
             ['주소', d.addr], ['전화', d.tel||'-'], ['총 의사수', d.dr+'명'],
             ['개설일자', d.open||'-'], ['통합의료기관코드', d.code||'-'],
             ['처방 근거자료', d.src||'-'], ['문전약국', d.ph.length+'곳']];
  document.getElementById('pane-info').innerHTML =
    '<div class="tw" style="max-height:none"><table><tbody>'
    + r.map(x=>'<tr><td style="color:#5a6676;width:120px">'+x[0]+'</td><td style="text-align:left;white-space:normal">'+esc(x[1])+'</td></tr>').join('')
    + '</tbody></table></div>';
}

/* 전체 메모 보기 / 내보내기 */
function openAllMemo(){
  const names = DATA.items.filter(d=>hasMemo(d.n)).map(d=>d.n);
  CUR = null;
  document.getElementById('mTitle').textContent = '인수인계 메모 전체 ('+names.length+'곳)';
  document.getElementById('mask').classList.add('on');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
  const el = document.getElementById('pane-memo');
  el.classList.add('on');
  if(!names.length){ el.innerHTML = '<div class="empty">작성된 메모가 없습니다.</div>'; return; }
  let h = '<div class="memobar" style="margin:0 0 10px"><button class="ghost" onclick="copyAll()">전체 복사</button>'
        + '<button class="ghost" onclick="exportMemo()">JSON 내보내기</button></div>';
  names.forEach(n=>{
    h += '<div class="pcard" style="display:block"><div class="pn">'+esc(n)+'</div>'
       + '<div class="pa" style="white-space:pre-wrap;margin-top:6px;color:#1b2330">'+esc(MEMO[n].text)+'</div>'
       + '<div class="pa" style="margin-top:6px">'+esc(MEMO[n].at||'')+'</div></div>';
  });
  el.innerHTML = h;
}
function allText(){
  return DATA.items.filter(d=>hasMemo(d.n))
    .map(d=>'['+d.n+'] ('+d.dong+'/'+d.spec+')\n'+MEMO[d.n].text).join('\n\n');
}
function copyAll(){ navigator.clipboard.writeText(allText()).then(()=>alert('전체 메모를 복사했습니다.')); }
function exportMemo(){
  const blob = new Blob([JSON.stringify({target:DATA.target, exported:new Date().toISOString(), memo:MEMO}, null, 2)],
                        {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '인수인계메모_박준상_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}
function importMemo(inp){
  const f = inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result);
      const inc = o.memo || o;
      let add = 0;
      Object.keys(inc).forEach(k=>{
        const nv = typeof inc[k] === 'string' ? {text:inc[k], at:''} : inc[k];
        const old = MEMO[k];
        if(!old || (nv.at||'') >= (old.at||'')) { MEMO[k] = nv; add++; }
      });
      saveStore(); render();
      alert(add+'곳의 메모를 불러왔습니다.');
    } catch(e){ alert('JSON 형식을 읽을 수 없습니다.'); }
  };
  rd.readAsText(f);
  inp.value = '';
}

/* 시작 */
render();
if (HAS_MAP) {
  map.fitBounds(DATA.items.map(d=>[d.lat,d.lng]), {padding:[30,30]});
} else {
  document.getElementById('panel').classList.add('on');
}
if (typeof Chart === 'undefined') warn('차트 라이브러리 로드 실패 — 실적은 표로 표시합니다.');
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script>
</body>
