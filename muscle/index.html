<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1424">
<title>머슬플랜 - 집에서 근육 키우기</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="머슬플랜">
<style>
:root{
  --bg:#0b1424; --bg2:#101d33; --card:#152641; --card2:#1b3050; --line:#25406b;
  --txt:#e9eff9; --dim:#8ea3c4; --dim2:#5f7599;
  --acc:#3ad6c4; --acc2:#5b8cff; --gold:#f5c451; --good:#4ade80; --bad:#ff6b6b;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior:none}
body{
  background:var(--bg); color:var(--txt);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',system-ui,sans-serif;
  font-size:15px; line-height:1.55; letter-spacing:-.2px;
  padding-bottom:calc(76px + var(--sab));
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;font-size:15px}
input,select{font-family:inherit;font-size:16px}
.hide{display:none !important}

/* ---------- 헤더 ---------- */
header{
  position:sticky;top:0;z-index:40;background:rgba(11,20,36,.92);backdrop-filter:blur(12px);
  padding:calc(var(--sat) + 12px) 16px 12px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(37,64,107,.5);
}
.logo{font-size:18px;font-weight:800;letter-spacing:-.6px}
.logo span{color:var(--acc)}
.hbtn{margin-left:auto;width:36px;height:36px;border-radius:11px;background:var(--card);
  display:flex;align-items:center;justify-content:center}
.hbtn svg{width:19px;height:19px;stroke:var(--dim);fill:none;stroke-width:1.8}

/* ---------- 공통 ---------- */
.wrap{padding:16px 16px 24px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card.flat{background:var(--bg2)}
.sect{font-size:12px;font-weight:800;color:var(--dim);letter-spacing:.4px;margin:22px 2px 9px;text-transform:uppercase}
.sect:first-child{margin-top:4px}
.row{display:flex;align-items:center;gap:10px}
.sp{margin-left:auto}
.mut{color:var(--dim)}
.sm{font-size:13px}
.xs{font-size:11.5px}
.b{font-weight:700}
.big{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;
  font-size:11.5px;font-weight:700;background:var(--card2);color:var(--dim)}
.pill.acc{background:rgba(58,214,196,.14);color:var(--acc)}
.pill.gold{background:rgba(245,196,81,.14);color:var(--gold)}
.pill.good{background:rgba(74,222,128,.14);color:var(--good)}
.pill.bad{background:rgba(255,107,107,.14);color:var(--bad)}
.btn{display:block;width:100%;padding:15px;border-radius:15px;background:var(--card2);
  font-weight:700;text-align:center;border:1px solid var(--line)}
.btn.primary{background:linear-gradient(135deg,#3ad6c4,#2fb8d4);color:#04202a;border:none;
  font-size:17px;font-weight:800;padding:18px;box-shadow:0 8px 22px -8px rgba(58,214,196,.6)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:active{transform:scale(.985)}
.btn2{display:flex;gap:9px}
.btn2>*{flex:1}

/* ---------- 홈 ---------- */
.hero{background:linear-gradient(160deg,#16304f,#111f36);border:1px solid var(--line);
  border-radius:22px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.hero:after{content:'';position:absolute;right:-40px;top:-40px;width:150px;height:150px;
  border-radius:50%;background:radial-gradient(circle,rgba(58,214,196,.18),transparent 70%)}
.greet{font-size:13px;color:var(--dim);margin-bottom:2px}
.htitle{font-size:24px;font-weight:800;letter-spacing:-.8px;margin-bottom:12px}
.dots{display:flex;gap:6px;align-items:center;margin-bottom:14px}
.dot{width:26px;height:6px;border-radius:3px;background:var(--line)}
.dot.on{background:var(--acc)}
.dot.today{background:var(--gold)}
.preview{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ptag{font-size:11.5px;padding:5px 9px;border-radius:9px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.07);color:#c8d6ea}
.goal{background:rgba(245,196,81,.1);border:1px solid rgba(245,196,81,.25);border-radius:13px;
  padding:11px 13px;margin-bottom:14px;font-size:13.5px;color:#ffe6ac}
.goal b{color:var(--gold)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat3>div{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 10px;text-align:center}
.stat3 .v{font-size:21px;font-weight:800;letter-spacing:-.5px}
.stat3 .l{font-size:11px;color:var(--dim);margin-top:1px}

/* ---------- 플레이어 ---------- */
#player{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;
  padding-top:var(--sat);padding-bottom:var(--sab)}
.pbar{padding:12px 16px 0}
.ptop{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.ptime{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.pstep{font-size:12px;color:var(--dim);font-weight:700}
.pquit{width:32px;height:32px;border-radius:10px;background:var(--card);display:flex;
  align-items:center;justify-content:center;font-size:17px;color:var(--dim)}
.track{height:5px;border-radius:3px;background:var(--card2);overflow:hidden}
.track>i{display:block;height:100%;background:linear-gradient(90deg,#3ad6c4,#5b8cff);
  border-radius:3px;transition:width .4s}
.track.over>i{background:linear-gradient(90deg,#f5c451,#ff8a5b)}
.pbody{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;justify-content:center}
.pfoot{padding:12px 16px 16px}

.exblock{text-align:center}
.exlv{display:inline-flex;align-items:center;gap:7px;margin-bottom:12px}
.lvbar{display:flex;gap:3px}
.lvbar i{width:14px;height:4px;border-radius:2px;background:var(--line)}
.lvbar i.on{background:var(--acc)}
.exname{font-size:27px;font-weight:800;letter-spacing:-1px;line-height:1.2;margin-bottom:5px}
.exeasy{font-size:14px;color:var(--dim);margin-bottom:16px}
.extgt{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:9px 16px;font-size:14px;font-weight:700;margin-bottom:20px}
.extgt b{color:var(--acc)}
.counter{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:8px}
.cbtn{width:58px;height:58px;border-radius:50%;background:var(--card);border:1px solid var(--line);
  font-size:26px;font-weight:300;display:flex;align-items:center;justify-content:center;color:var(--acc)}
.cbtn:active{background:var(--card2)}
.cval{font-size:64px;font-weight:800;letter-spacing:-3px;min-width:110px;font-variant-numeric:tabular-nums;line-height:1}
.cunit{font-size:13px;color:var(--dim);margin-bottom:18px}
.lasthint{font-size:12.5px;color:var(--dim);margin-bottom:16px}
.lasthint b{color:var(--txt)}
.howbtn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:12px;
  background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--dim)}
.pairtag{font-size:11.5px;color:var(--acc);font-weight:700;margin-bottom:10px;letter-spacing:.3px}

/* 휴식 */
.restwrap{text-align:center}
.ring{position:relative;width:214px;height:214px;margin:0 auto 20px}
.ring svg{transform:rotate(-90deg)}
.ring .bgc{stroke:var(--card2)}
.ring .fgc{stroke:var(--acc);transition:stroke-dashoffset .95s linear}
.ring .inn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .n{font-size:52px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.ring .t{font-size:12px;color:var(--dim);letter-spacing:.5px;font-weight:700}
.nextup{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 15px;
  text-align:left;margin-bottom:6px}
.nextup .l{font-size:11px;color:var(--acc);font-weight:800;letter-spacing:.5px;margin-bottom:3px}
.nextup .n{font-size:17px;font-weight:700}
.nextup .s{font-size:12.5px;color:var(--dim)}

/* 준비운동 */
.warmnum{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.5px;margin-bottom:8px}
.holdt{font-size:60px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums;margin:6px 0 4px}

/* ---------- 마무리 ---------- */
#finish{position:fixed;inset:0;z-index:210;background:var(--bg);overflow-y:auto;
  padding:calc(var(--sat) + 20px) 16px calc(var(--sab) + 20px)}
.fin-h{text-align:center;margin-bottom:20px}
.fin-h .t{font-size:27px;font-weight:800;letter-spacing:-1px}
.fin-h .s{color:var(--dim);font-size:14px;margin-top:3px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.fgrid>div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.fgrid .v{font-size:24px;font-weight:800;letter-spacing:-.8px}
.fgrid .l{font-size:11.5px;color:var(--dim);margin-top:2px}
.badge{display:flex;align-items:center;gap:11px;background:linear-gradient(120deg,rgba(245,196,81,.16),rgba(245,196,81,.04));
  border:1px solid rgba(245,196,81,.3);border-radius:15px;padding:13px 15px;margin-bottom:9px}
.badge .ic{width:34px;height:34px;border-radius:11px;background:rgba(245,196,81,.2);color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:0 0 auto}
.badge .tt{font-weight:800;font-size:14.5px}
.badge .ss{font-size:12.5px;color:var(--dim)}
.badge.up{background:linear-gradient(120deg,rgba(58,214,196,.16),rgba(58,214,196,.04));border-color:rgba(58,214,196,.32)}
.badge.up .ic{background:rgba(58,214,196,.2);color:var(--acc)}
.pick{display:flex;gap:8px}
.pick button{flex:1;padding:13px 6px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);
  font-size:13.5px;font-weight:700;color:var(--dim)}
.pick button.on{background:rgba(58,214,196,.14);border-color:var(--acc);color:var(--acc)}
textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:14px;
  padding:13px;color:var(--txt);font-size:15px;resize:none;font-family:inherit}

/* ---------- 기록 ---------- */
.heat{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--card2);display:block}
.heat i.l1{background:rgba(58,214,196,.35)}
.heat i.l2{background:rgba(58,214,196,.65)}
.heat i.l3{background:var(--acc)}
.heat i.fut{background:rgba(255,255,255,.03)}
.hlbl{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:5px;font-size:9.5px;color:var(--dim);text-align:center}
.sess{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid rgba(37,64,107,.45)}
.sess:last-child{border-bottom:none}
.sess .d{width:44px;flex:0 0 auto;text-align:center}
.sess .d .m{font-size:10.5px;color:var(--dim)}
.sess .d .n{font-size:18px;font-weight:800;line-height:1}
.sess .tag{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;background:var(--card2);color:var(--acc);flex:0 0 auto}
.sess .info{flex:1;min-width:0}
.sess .info .t{font-size:14px;font-weight:700}
.sess .info .s{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 성장 ---------- */
.lvrow{display:flex;align-items:center;gap:11px;padding:10px 0}
.lvrow .nm{width:88px;flex:0 0 auto;font-size:13.5px;font-weight:700}
.lvrow .bar{flex:1;height:8px;border-radius:4px;background:var(--card2);overflow:hidden;display:flex;gap:2px}
.lvrow .bar i{flex:1;background:var(--card2);border-radius:2px}
.lvrow .bar i.on{background:linear-gradient(90deg,#3ad6c4,#5b8cff)}
.lvrow .cur{font-size:11.5px;color:var(--dim);width:70px;text-align:right;flex:0 0 auto}
.chart{display:flex;align-items:flex-end;gap:6px;height:104px;margin:8px 0 4px}
.chart .cb{flex:1;background:linear-gradient(180deg,#3ad6c4,#2b7fa8);border-radius:5px 5px 0 0;min-height:3px;position:relative}
.chart .cb.now{background:linear-gradient(180deg,#f5c451,#e08a3c)}
.clbl{display:flex;gap:6px;font-size:10px;color:var(--dim);text-align:center}
.clbl div{flex:1}
.bal{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--card2);margin:8px 0}
.bal i{display:block;height:100%}
.tip{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid rgba(37,64,107,.4);font-size:13.5px;line-height:1.5}
.tip:last-child{border-bottom:none}
.tip .ic{width:5px;flex:0 0 auto;border-radius:3px;background:var(--acc)}
.tip.warn .ic{background:var(--gold)} .tip.bad .ic{background:var(--bad)} .tip.good .ic{background:var(--good)}

/* ---------- 하단 탭 ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:rgba(11,20,36,.95);backdrop-filter:blur(14px);border-top:1px solid rgba(37,64,107,.6);
  padding-bottom:var(--sab)}
nav button{flex:1;padding:11px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:700;color:var(--dim)}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}

/* ---------- 모달/시트 ---------- */
.modal{position:fixed;inset:0;z-index:300;background:rgba(4,9,18,.72);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--bg2);
  border-radius:24px 24px 0 0;padding:8px 18px calc(24px + var(--sab));border-top:1px solid var(--line)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 16px}
.sh-t{font-size:20px;font-weight:800;letter-spacing:-.6px;margin-bottom:3px}
.fld{margin-bottom:15px}
.fld>label{display:block;font-size:12.5px;color:var(--dim);font-weight:700;margin-bottom:7px}
.fld input[type=number],.fld input[type=text]{width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:13px;color:var(--txt)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:12px 4px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  font-size:13.5px;font-weight:700;color:var(--dim)}
.seg button.on{background:rgba(58,214,196,.15);border-color:var(--acc);color:var(--acc)}
.tog{display:flex;align-items:center;padding:13px 0;border-bottom:1px solid rgba(37,64,107,.45)}
.tog:last-of-type{border-bottom:none}
.sw{margin-left:auto;width:46px;height:27px;border-radius:14px;background:var(--card2);position:relative;
  border:1px solid var(--line);flex:0 0 auto}
.sw:after{content:'';position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;
  background:var(--dim);transition:.2s}
.sw.on{background:rgba(58,214,196,.28);border-color:var(--acc)}
.sw.on:after{left:22px;background:var(--acc)}

/* 가이드 */
.gsteps{margin:14px 0}
.gnum{display:flex;gap:11px;margin-bottom:10px}
.gnum .n{width:23px;height:23px;border-radius:8px;background:var(--acc);color:#04202a;font-size:12px;
  font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.gnum .t{font-size:14px;line-height:1.45;padding-top:1px}
.gbox{border-radius:14px;padding:12px 14px;margin-bottom:9px;font-size:13.5px;line-height:1.5}
.gbox .gt{display:block;font-size:11.5px;font-weight:800;letter-spacing:.4px;margin-bottom:5px}
.gbox ul{margin:0;padding-left:16px} .gbox li{margin-bottom:3px}
.gbox.tip{background:rgba(74,222,128,.09);border:1px solid rgba(74,222,128,.24)} .gbox.tip .gt{color:var(--good)}
.gbox.bad{background:rgba(255,107,107,.09);border:1px solid rgba(255,107,107,.24)} .gbox.bad .gt{color:var(--bad)}
.gbox.knee{background:rgba(245,196,81,.09);border:1px solid rgba(245,196,81,.26)} .gbox.knee .gt{color:var(--gold)}
.ytb{display:block;text-align:center;padding:13px;border-radius:14px;background:#c0392b;color:#fff;
  font-weight:800;text-decoration:none;font-size:14px;margin-top:4px}
.bodymap{display:block;margin:0 auto}
.empty{text-align:center;padding:34px 16px;color:var(--dim);font-size:14px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--sab));transform:translateX(-50%);z-index:400;
  background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:11px 18px;
  font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
.toast.on{opacity:1;bottom:calc(102px + var(--sab))}
</style>
</head>
<body>

<header>
  <div class="logo">머슬<span>플랜</span></div>
  <button class="hbtn" onclick="openSettings()" aria-label="설정">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<div id="tabHome" class="wrap"></div>
<div id="tabLog"  class="wrap hide"></div>
<div id="tabGrow" class="wrap hide"></div>

<nav>
  <button id="nvHome" class="on" onclick="go('home')">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>오늘</button>
  <button id="nvLog" onclick="go('log')">
    <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="17" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg>기록</button>
  <button id="nvGrow" onclick="go('grow')">
    <svg viewBox="0 0 24 24"><path d="M3 17l5.5-6 4 4L21 6"/><path d="M21 11V6h-5"/></svg>성장</button>
</nav>

<!-- ============ 세션 플레이어 ============ -->
<div id="player" class="hide">
  <div class="pbar">
    <div class="ptop">
      <div class="ptime" id="pTime">0:00</div>
      <div class="pstep" id="pStep"></div>
      <button class="pquit sp" onclick="quitSession()">&times;</button>
    </div>
    <div class="track" id="pTrack"><i id="pFill" style="width:0%"></i></div>
  </div>
  <div class="pbody" id="pBody"></div>
  <div class="pfoot" id="pFoot"></div>
</div>

<!-- ============ 마무리 ============ -->
<div id="finish" class="hide"></div>

<!-- ============ 가이드 시트 ============ -->
<div class="modal" id="guideModal" onclick="if(event.target===this)closeGuide()">
  <div class="sheet" id="guideBody"></div>

   저장키 musclePlan_v2 (v1 기록 자동 이관)
   ================================================================== */

const KEY='musclePlan_v2', OLDKEY='musclePlan_v1';

/* ---------------- 기본값 ---------------- */
function blank(){return{
  profile:{weight:75,age:45,days:3,minutes:30,db:8,dbN:2,kb:10,pullbar:true,knee:true},
  opt:{wake:true,sound:true,vib:true,rest:60},
  levels:{},          // 패턴별 현재 레벨
  clears:{},          // 패턴별 연속 목표달성 횟수
  logs:[],            // 세션 기록
  prs:{},             // 종목별 최고기록
  bodylog:[],         // 체중 기록
  created:Date.now()
};}
let DB=loadDB();
function loadDB(){
  let d;
  try{d=JSON.parse(localStorage.getItem(KEY));}catch(e){d=null;}
  if(!d){ d=blank(); migrateV1(d); }
  const b=blank();
  d.profile=Object.assign(b.profile,d.profile||{});
  d.opt=Object.assign(b.opt,d.opt||{});
  d.levels=d.levels||{}; d.clears=d.clears||{}; d.logs=d.logs||[];
  d.prs=d.prs||{}; d.bodylog=d.bodylog||[];
  return d;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){toast('저장 공간이 부족해요');}}

/* v1 기록 이관 — 횟수/날짜만 살려서 히스토리 유지 */
function migrateV1(d){
  let o; try{o=JSON.parse(localStorage.getItem(OLDKEY));}catch(e){return;}
  if(!o||!o.logs||!o.logs.length)return;
  if(o.profile&&o.profile.weight)d.profile.weight=o.profile.weight;
  if(o.profile&&o.profile.age)d.profile.age=o.profile.age;
  d.logs=o.logs.map(l=>{
    let sets=0,vol=0;
    (l.entries||[]).forEach(e=>(e.sets||[]).forEach(s=>{if(s.weight&&s.reps){sets++;vol+=s.weight*s.reps;}}));
    return{date:l.date||Date.now(),tpl:'구',dur:0,sets,vol:Math.round(vol),entries:[],
           mood:'',knee:'',memo:'',legacy:true};
  });
}

/* ==================== 유틸 ==================== */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const mmss=s=>Math.floor(s/60)+':'+pad(s%60);
const dnum=d=>{const t=new Date(d);return t.getFullYear()*10000+(t.getMonth()+1)*100+t.getDate();};
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime();};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1900);}
function isoWeekKey(d){const t=new Date(d);const day=(t.getDay()+6)%7;t.setDate(t.getDate()-day);
  t.setHours(0,0,0,0);return t.getTime();}
function comma(n){return Math.round(n).toLocaleString('ko-KR');}

/* 운동 무게 계산 */
function loadKg(ex){
  const p=DB.profile;
  if(ex.load==='db')return p.db||8;
  if(ex.load==='kb')return p.kb||10;
  if(ex.load==='bwkb')return Math.round((p.weight||75)+(p.kb||10));
  return Math.round((p.weight||75)*(ex.bwF||.5));
}
function volOf(ex,reps,sec){
  const w=loadKg(ex);
  let r = ex.type==='hold' ? (sec||0)/3 : (reps||0);
  if(ex.type==='side')r*=2;
  return w*r;
}
function curLevel(pat){
  const max=(LADDER[pat]||[]).length;
  let l=DB.levels[pat]||1;
  return Math.max(1,Math.min(max,l));
}
function exOfPat(pat,lvOff){
  const arr=LADDER[pat]||[];if(!arr.length)return null;
  let i=curLevel(pat)-1+(lvOff||0);
  i=Math.max(0,Math.min(arr.length-1,i));
  return arr[i];
}
/* 장비 없으면 대체 */
function usable(id){
  const e=EX[id];if(!e)return false;
  if((e.load==='bw'||e.load==='bwkb')&&(e.pat==='vpull'||id==='chinup')&&!DB.profile.pullbar)return false;
  if(e.load==='bwkb'&&!DB.profile.pullbar)return false;
  return true;
}
function pickEx(pat,kneeState){
  if(pat==='knee'){
    if(kneeState==='bad')return 'wallsit';
    let id=exOfPat(pat,kneeState==='soso'?-1:0);
    return id;
  }
  if(pat==='vpull'&&!DB.profile.pullbar)return exOfPat('hpull',0);
  let id=exOfPat(pat,0);
  if(!usable(id)){
    const arr=LADDER[pat]||[];
    for(let i=arr.length-1;i>=0;i--)if(usable(arr[i]))return arr[i];
    return arr[0];
  }
  return id;
}

/* 다음 템플릿 추천 */
function nextTpl(){
  const real=DB.logs.filter(l=>!l.legacy);
  const wkCount=weekSessions().length;
  const target=+DB.profile.days||3;
  if(!real.length)return 'A';
  const last=real[real.length-1].tpl;
  if(target>=4&&wkCount>=3&&wkCount<target)return 'C';
  return last==='A'?'B':(last==='B'?'A':'A');
}
function weekSessions(){
  const wk=isoWeekKey(Date.now());
  return DB.logs.filter(l=>!l.legacy&&isoWeekKey(l.date)===wk);
}
function streakWeeks(){
  const target=+DB.profile.days||3;let n=0;
  let wk=isoWeekKey(Date.now());
  const cnt=w=>DB.logs.filter(l=>!l.legacy&&isoWeekKey(l.date)===w).length;
  if(cnt(wk)<target)wk-=7*86400000;
  while(cnt(wk)>=target){n++;wk-=7*86400000;}
  return n;
}
function didToday(){const t=dnum(Date.now());return DB.logs.some(l=>!l.legacy&&dnum(l.date)===t);}

    $('nv'+x[0].toUpperCase()+x.slice(1)).classList.toggle('on',x===t);});

}

function esc(s){return String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}

function weekPlanHTML(next,done,target){
  const seq=[];let t=next;
  for(let i=0;i<target-done;i++){seq.push(t);t=(t==='A')?'B':(t==='B'?'A':'A');}
  let out='';
  for(let i=0;i<done;i++)out+=`<div class="row" style="padding:8px 0;color:var(--dim)"><span class="pill good">완료</span><span style="margin-left:8px">${i+1}번째 운동</span></div>`;
  seq.forEach((x,i)=>{out+=`<div class="row" style="padding:8px 0"><span class="pill ${i===0?'acc':''}">${TPL[x].short}</span>
    <span style="margin-left:8px">${TPL[x].name}</span><span class="sp sm mut">${i===0?'다음':''}</span></div>`;});
  if(!seq.length)out+=`<div class="sm" style="color:var(--good);padding:6px 0">이번 주 목표를 다 채웠어요. 더 하시면 보너스입니다.</div>`;
  return out;
}
function estimateMin(tpl){
  const T=TPL[tpl];let sec=WARM.reduce((a,w)=>a+w.sec,0)+40;
  T.blocks.forEach(b=>{const rest=restFor(b),r=roundsOf(b);
    sec+=r*(b.pats.length*42+ (b.pats.length-1)*15 + rest);});
  return Math.round(sec/60);
}
function restFor(b){const base=+DB.opt.rest||60;
  return b.pats.indexOf('core')>=0?Math.max(35,base-20):base;}
/* 설정한 "한 번에 쓸 시간"에 따라 라운드 수를 조절 */
function roundsOf(b){
  const m=+DB.profile.minutes||30;
  const d=m<=20?-1:(m>=40?1:0);
  return Math.max(2,b.rounds+d);
}

function todayGoal(tpl){
  const T=TPL[tpl];
  for(const b of T.blocks)for(const pat of b.pats){
    const id=pickEx(pat,'ok');if(!id)continue;
    const ex=EX[id];const last=lastPerf(id);
    const c=DB.clears[pat]||0;
    if(c===1){return `<b>${ex.n}</b> 한 번만 더 목표를 채우면 <b>다음 단계</b>로 올라갑니다.`;}
    if(last){
      const tgtTop=ex.tgt[1];
      const best=ex.type==='hold'?last.sec:last.reps;
      if(best&&best<tgtTop)return `오늘 목표: <b>${ex.n} ${best}${unit(ex)} → ${Math.min(tgtTop,best+1)}${unit(ex)}</b>`;
    }
  }
  return `준비운동 3분은 건너뛰지 마세요. <b>무릎을 지키는 시간</b>입니다.`;
}
function unit(ex){return ex.type==='hold'?'초':'회';}
function lastPerf(id){
  for(let i=DB.logs.length-1;i>=0;i--){
    const e=(DB.logs[i].entries||[]).find(x=>x.id===id);
    if(e&&e.sets&&e.sets.length){
      const best=e.sets.reduce((a,s)=>Math.max(a,s.sec||s.reps||0),0);
      return{reps:best,sec:best,sets:e.sets.length,date:DB.logs[i].date};}
  }
  return null;
}

/* ==================== 세션 시작 전: 무릎 체크 ==================== */
let pendingTpl=null;
function preStart(tpl){
  pendingTpl=tpl;
  $('guideBody').innerHTML=`

    <button class="btn" style="margin-bottom:9px;text-align:left;padding:16px" onclick="startSession('ok')">

/* ==================== 세션 플레이어 ==================== */
let S=null,tickInt=null,restInt=null,holdInt=null,wakeLock=null,AC=null;

/* ---- 진행 중인 운동 자동 저장 ----
   뒤로가기·전화·앱 강제종료로 앱이 내려가도 세트 기록이 날아가지 않게 매 순간 저장한다.
   복구 시 경과시간은 '자리 비운 시간'을 빼고 이어간다(멈춰 있던 걸로 계산). */
const SKEY='musclePlan_sess';
function sessSave(){
  if(!S)return;
  try{
    localStorage.setItem(SKEY,JSON.stringify({
      tpl:S.tpl,knee:S.knee,elapsed:S.elapsed,i:S.i,rec:S.rec,at:Date.now(),
      q:S.q.map(it=>it.t==='warm'?{t:'warm',wi:WARM.indexOf(it.w),i:it.i,n:it.n}:it)
    }));
  }catch(e){}
}
function sessClear(){try{localStorage.removeItem(SKEY);}catch(e){}}
function sessLoad(){
  try{
    const d=JSON.parse(localStorage.getItem(SKEY));
    if(!d||!Array.isArray(d.q)||!d.q.length)return null;
    if(Date.now()-(d.at||0)>12*3600000){sessClear();return null;}   // 12시간 지난 건 폐기
    d.q=d.q.map(it=>it.t==='warm'?{t:'warm',w:WARM[it.wi]||WARM[0],i:it.i,n:it.n}:it);
    return d;
  }catch(e){sessClear();return null;}
}
function startTick(){
  clearInterval(tickInt);
  tickInt=setInterval(()=>{
    if(!S)return;
    S.elapsed=Math.floor((Date.now()-S.start)/1000);
    paintTop();
    if(S.elapsed%3===0)sessSave();
  },1000);
}
function resumeSession(){
  const d=sessLoad();
  if(!d){renderHome();return toast('이어서 할 운동이 없어요');}
  S={tpl:d.tpl,knee:d.knee,start:Date.now()-(d.elapsed||0)*1000,elapsed:d.elapsed||0,
     q:d.q,i:d.i||0,rec:d.rec||{},holdSec:0,holdRun:false,val:0,paused:false};
  $('player').classList.remove('hide');
  document.body.style.overflow='hidden';
  startTick();requestWake();guardPush();renderStep();
  toast('이어서 진행합니다');
}
function dropSession(){
  if(!confirm('진행 중이던 운동 기록을 버릴까요?'))return;
  sessClear();renderHome();toast('지웠어요');
}

function startSession(kneeState){
  $('guideModal').classList.remove('on');
  const tpl=pendingTpl||'A';
  S={tpl,knee:kneeState,start:Date.now(),elapsed:0,q:buildQueue(tpl,kneeState),i:0,
     rec:{},holdSec:0,holdRun:false,val:0,paused:false};
  $('player').classList.remove('hide');
  document.body.style.overflow='hidden';
  startTick();sessSave();
  requestWake();guardPush();
  renderStep();
}
function buildQueue(tpl,kneeState){
  const q=[];
  WARM.forEach((w,i)=>q.push({t:'warm',w,i:i+1,n:WARM.length}));
  const T=TPL[tpl];
  T.blocks.forEach((b,bi)=>{
    const ids=b.pats.map(p=>pickEx(p,kneeState)).filter(Boolean);
    const rest=restFor(b),nr=roundsOf(b);
    for(let r=1;r<=nr;r++){
      ids.forEach((id,ei)=>{
        q.push({t:'set',id,pat:b.pats[ei],r,rounds:nr,bi,pair:ids,pairIdx:ei});
        const lastOfPair=(ei===ids.length-1);
        const veryLast=(r===nr&&bi===T.blocks.length-1&&lastOfPair);
        if(!veryLast)q.push({t:'rest',sec:lastOfPair?rest:15,short:!lastOfPair});
      });
    }
  });
  q.push({t:'end'});
  return q;
}
function paintTop(){
  if(!S)return;
  $('pTime').textContent=mmss(S.elapsed);
  const goal=(+DB.profile.minutes||30)*60;
  const pct=Math.min(100,S.elapsed/goal*100);
  $('pFill').style.width=pct+'%';
  $('pTrack').classList.toggle('over',S.elapsed>goal);
  const sets=S.q.filter(x=>x.t==='set').length;
  const doneSets=S.q.slice(0,S.i).filter(x=>x.t==='set').length;
  const cur=S.q[S.i];
  $('pStep').textContent=cur&&cur.t==='warm'?`준비운동 ${cur.i}/${cur.n}`:`${Math.min(doneSets+1,sets)} / ${sets} 세트`;
}
function renderStep(){
  if(!S)return;
  const it=S.q[S.i];
  if(!it||it.t==='end'){return finishSession();}
  paintTop();
  clearInterval(holdInt);S.holdRun=false;
  if(it.t==='warm')return renderWarm(it);
  if(it.t==='rest')return renderRest(it);
  return renderSet(it);
}

/* --- 준비운동 --- */
function renderWarm(it){
  S.holdSec=it.w.sec;
  $('pBody').innerHTML=`
    <div class="exblock">
      <div class="warmnum">준비운동 ${it.i} / ${it.n}</div>
      <div class="exname">${it.w.n}</div>
      <div class="exeasy">${it.w.e}</div>
      <div class="holdt" id="hT">${it.w.sec}</div>
      <div class="cunit">초</div>
      <button class="howbtn" onclick="showGuideW(${it.i-1})">방법 보기</button>
    </div>`;
  $('pFoot').innerHTML=`
    <div class="btn2">
      <button class="btn" onclick="nextStep()">건너뛰기</button>
      <button class="btn primary" id="hBtn" onclick="toggleHold(${it.w.sec})">시작</button>
    </div>`;
}
function toggleHold(total){
  if(S.holdRun){clearInterval(holdInt);S.holdRun=false;$('hBtn').textContent='계속';return;}
  S.holdRun=true;$('hBtn').textContent='멈춤';
  clearInterval(holdInt);
  holdInt=setInterval(()=>{
    S.holdSec--;
    const el=$('hT');if(el)el.textContent=Math.max(0,S.holdSec);
    if(S.holdSec<=0){clearInterval(holdInt);S.holdRun=false;beep();buzz();nextStep();}
  },1000);
}

/* --- 세트 --- */
function renderSet(it){
  const ex=EX[it.id];
  const arr=LADDER[ex.pat]||[];const li=arr.indexOf(it.id);
  const lvb=arr.map((_,i)=>`<i class="${i<=li?'on':''}"></i>`).join('');
  const last=lastPerf(it.id);
  const isHold=ex.type==='hold';
  // 첫 도전이면 목표 하단에서 시작(그냥 탭만 해도 기록이 부풀지 않게), 이후엔 지난번 값
  S.val = last ? (isHold?last.sec:last.reps) : ex.tgt[0];
  if(!S.val)S.val=ex.tgt[0];
  S.holdSec=S.val;

  const pairName=it.pair.length>1?
    `${it.pair.map((id,i)=>i===it.pairIdx?`<b style="color:var(--acc)">${EX[id].n}</b>`:EX[id].n).join(' → ')}`:'';

  const w=loadKg(ex);
  const wtxt=ex.load==='bw'?`맨몸 (약 ${w}kg)`:ex.load==='db'?`아령 ${DB.profile.db}kg`:
             ex.load==='kb'?`케틀벨 ${DB.profile.kb}kg`:`몸무게+케틀벨 ${w}kg`;

  $('pBody').innerHTML=`
    <div class="exblock">
      ${pairName?`<div class="pairtag">짝운동 · ${it.r}라운드 / ${it.rounds}</div>`:''}
      <div class="exlv"><span class="pill acc">${PATNAME[ex.pat]||''}</span><span class="lvbar">${lvb}</span></div>
      <div class="exname">${ex.n}</div>
      <div class="exeasy">${ex.e}</div>
      <div class="extgt">목표 <b>${ex.tgt[0]}~${ex.tgt[1]}${unit(ex)}</b>${ex.type==='side'?' (한쪽씩)':''} · ${wtxt}</div>
      ${isHold?renderHoldUI():renderRepUI()}
      ${last?`<div class="lasthint">지난번 <b>${isHold?last.sec+'초':last.reps+'회'}</b></div>`:
              `<div class="lasthint">첫 도전이에요. 목표 범위 안에서 편하게</div>`}
      <button class="howbtn" onclick="showGuide('${it.id}')">방법 보기</button>
    </div>`;
  $('pFoot').innerHTML=`<button class="btn primary" onclick="doneSet()">세트 완료</button>`;
}
function renderRepUI(){
  return `<div class="counter">
      <button class="cbtn" onclick="adj(-1)">&minus;</button>
      <div class="cval" id="cVal">${S.val}</div>
      <button class="cbtn" onclick="adj(1)">+</button>
    </div><div class="cunit">회</div>`;
}
function renderHoldUI(){
  return `<div class="counter">
      <button class="cbtn" onclick="adj(-5)">&minus;</button>
      <div class="cval" id="cVal">${S.val}</div>
      <button class="cbtn" onclick="adj(5)">+</button>
    </div><div class="cunit">초 &nbsp;·&nbsp; <span id="hRun" style="color:var(--acc);font-weight:700;cursor:pointer" onclick="runHold()">타이머 시작</span></div>`;
}
function runHold(){
  if(S.holdRun){clearInterval(holdInt);S.holdRun=false;$('hRun').textContent='이어서';return;}
  S.holdSec=S.val;S.holdRun=true;$('hRun').textContent='멈춤';
  clearInterval(holdInt);
  holdInt=setInterval(()=>{
    S.holdSec--;const el=$('cVal');if(el)el.textContent=Math.max(0,S.holdSec);
    if(S.holdSec<=0){clearInterval(holdInt);S.holdRun=false;beep();buzz();doneSet();}
  },1000);
}
function adj(d){
  if(S.holdRun)return;
  S.val=Math.max(0,S.val+d);S.holdSec=S.val;
  const el=$('cVal');if(el)el.textContent=S.val;
}
function doneSet(){
  clearInterval(holdInt);S.holdRun=false;
  const it=S.q[S.i];if(!it||it.t!=='set')return;
  const ex=EX[it.id];
  const r=S.rec[it.id]||(S.rec[it.id]={id:it.id,pat:it.pat,sets:[]});
  r.sets.push(ex.type==='hold'?{sec:S.val}:{reps:S.val});
  buzz(40);
  nextStep();
}
function nextStep(){clearInterval(holdInt);S.i++;renderStep();sessSave();}

/* --- 휴식 --- */
function renderRest(it){
  const nxt=S.q.slice(S.i+1).find(x=>x.t==='set'||x.t==='warm');
  let nlabel='마무리',nsub='';
  if(nxt&&nxt.t==='set'){const e=EX[nxt.id];nlabel=e.n;
    nsub=`${e.tgt[0]}~${e.tgt[1]}${unit(e)} · ${nxt.r}라운드/${nxt.rounds}`;}
  const R=214/2-9,C=2*Math.PI*R;
  $('pBody').innerHTML=`
    <div class="restwrap">
      <div class="ring">
        <svg width="214" height="214">
          <circle class="bgc" cx="107" cy="107" r="${R}" fill="none" stroke-width="11"/>
          <circle class="fgc" id="rArc" cx="107" cy="107" r="${R}" fill="none" stroke-width="11"
            stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/>
        </svg>
        <div class="inn"><div class="n" id="rNum">${it.sec}</div><div class="t">${it.short?'바로 다음':'휴 식'}</div></div>
      </div>
      <div class="nextup"><div class="l">다음</div><div class="n">${nlabel}</div><div class="s">${nsub}</div></div>
    </div>`;
  $('pFoot').innerHTML=`<div class="btn2">
      <button class="btn" onclick="addRest(15)">+15초</button>
      <button class="btn primary" onclick="nextStep()">바로 시작</button></div>`;
  S.restLeft=it.sec;S.restTotal=it.sec;S.arcC=C;
  clearInterval(restInt);
  restInt=setInterval(()=>{
    S.restLeft--;
    const n=$('rNum'),a=$('rArc');
    if(!n){clearInterval(restInt);return;}
    n.textContent=Math.max(0,S.restLeft);
    if(a)a.style.strokeDashoffset=S.arcC*(1-S.restLeft/S.restTotal);
    if(S.restLeft<=0){clearInterval(restInt);beep();buzz([80,60,80]);nextStep();}
  },1000);
}
function addRest(s){S.restLeft+=s;S.restTotal+=s;const n=$('rNum');if(n)n.textContent=S.restLeft;}

/* --- 소리/진동/화면 --- */
function beep(){
  if(!DB.opt.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    [0,.16].forEach((t,i)=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.value=i?1046:784;
      g.gain.setValueAtTime(.0001,AC.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.28,AC.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+.14);
      o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.16);
    });
  }catch(e){}
}
function buzz(p){if(!DB.opt.vib)return;try{navigator.vibrate&&navigator.vibrate(p||60);}catch(e){}}
async function requestWake(){
  if(!DB.opt.wake||!('wakeLock' in navigator))return;
  try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}
}
function releaseWake(){try{wakeLock&&wakeLock.release();}catch(e){}wakeLock=null;}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&S&&!wakeLock)requestWake();});

function quitSession(){
  const doneSets=Object.values(S?S.rec:{}).reduce((a,r)=>a+r.sets.length,0);
  if(doneSets>0){
    if(!confirm(`${doneSets}세트 했어요. 여기서 마칠까요?\n(취소하면 계속 진행)`))return;
    return finishSession();
  }
  closePlayer();
}
function closePlayer(){
  clearInterval(tickInt);clearInterval(restInt);clearInterval(holdInt);
  releaseWake();S=null;sessClear();
  $('player').classList.add('hide');$('finish').classList.add('hide');
  document.body.style.overflow='';
  go('home');
}

/* ==================== 안드로이드 뒤로가기 ====================
   PWA에서 뒤로가기를 그냥 두면 앱이 통째로 닫혀 운동이 날아간다.
   히스토리에 '가드'를 하나 깔아두고, 뒤로가기를 '지금 화면 닫기'로 해석한다. */
function guardPush(){try{history.pushState({mp:1},'');}catch(e){}}
function isOn(id){const e=$(id);return !!(e&&e.classList.contains('on'));}
let backHomeAt=0;
window.addEventListener('popstate',function(){
  if(isOn('guideModal')){guardPush();closeGuide();return;}      // 1) 열린 시트부터 닫기
  if(isOn('setModal')){guardPush();closeSettings();return;}
  if(!$('finish').classList.contains('hide')){                   // 2) 마무리 화면은 붙잡기
    guardPush();toast('아래 [저장하고 끝내기]를 눌러주세요');return;}
  if(S){guardPush();quitSession();return;}                       // 3) 운동 중이면 종료 확인
  if(TAB!=='home'){guardPush();go('home');return;}               // 4) 다른 탭이면 홈으로
  if(Date.now()-backHomeAt>2000){                                // 5) 홈에서 한 번 더 눌러야 종료
    backHomeAt=Date.now();guardPush();toast('한 번 더 누르면 앱이 닫혀요');return;}
});

/* ==================== 마무리 ==================== */
let finState={mood:'',knee:'',ups:[]};
function finishSession(){
  clearInterval(tickInt);clearInterval(restInt);clearInterval(holdInt);
  const recs=Object.values(S.rec);
  let sets=0,vol=0;
  recs.forEach(r=>{const ex=EX[r.id];r.sets.forEach(s=>{sets++;vol+=volOf(ex,s.reps,s.sec);});});
  const dur=S.elapsed;

  /* 신기록 판정 */
  const prs=[];
  recs.forEach(r=>{
    const ex=EX[r.id];
    const best=r.sets.reduce((a,s)=>Math.max(a,s.sec||s.reps||0),0);
    const old=DB.prs[r.id];
    if(best>0&&(!old||best>old.v)){prs.push({id:r.id,v:best,old:old?old.v:0});}
  });

  /* 레벨업 판정 — 모든 세트가 목표 상단 도달 (저장할 때만 실제 반영) */
  const ups=[],clr={};
  recs.forEach(r=>{
    const ex=EX[r.id];if(!ex.lv)return;
    const arr=LADDER[ex.pat]||[];
    if(arr.indexOf(r.id)!==arr.length-1){
      const allTop=r.sets.length>=2&&r.sets.every(s=>(s.sec||s.reps||0)>=ex.tgt[1]);
      const c=DB.clears[ex.pat]||0;
      if(allTop){
        clr[ex.pat]=c+1;
        if(c+1>=2)ups.push({pat:ex.pat,from:r.id,to:arr[arr.indexOf(r.id)+1]});
      }else clr[ex.pat]=0;
    }
  });
  finState={mood:'',knee:S.knee==='bad'?'아팠음':'',ups,clr};

  const entries=recs.map(r=>({id:r.id,pat:r.pat,sets:r.sets}));
  const log={date:Date.now(),tpl:S.tpl,dur,sets,vol:Math.round(vol),entries,
             mood:'',knee:S.knee,memo:''};
  finState.log=log;finState.prs=prs;

  const goal=(+DB.profile.minutes||30)*60;
  const rice=Math.round(vol/20);

  let html=`<div style="max-width:560px;margin:0 auto">
    <div class="fin-h">
      <div class="t">운동 끝!</div>
      <div class="s">${TPL[S.tpl].name} · ${new Date().getMonth()+1}월 ${new Date().getDate()}일</div>
    </div>
    <div class="fgrid">
      <div><div class="v">${mmss(dur)}</div><div class="l">걸린 시간 ${dur<=goal?'(목표 안)':'(목표 초과)'}</div></div>
      <div><div class="v">${sets}</div><div class="l">완료 세트</div></div>
      <div><div class="v">${comma(vol)}<span style="font-size:13px">kg</span></div><div class="l">오늘 든 총 무게</div></div>
      <div><div class="v">${rice}</div><div class="l">쌀 20kg 포대 (환산)</div></div>
    </div>`;

  ups.forEach(u=>{html+=`<div class="badge up"><div class="ic">UP</div>
    <div><div class="tt">레벨 업 · ${PATNAME[u.pat]}</div>
    <div class="ss">${EX[u.from].n} → <b style="color:var(--acc)">${EX[u.to].n}</b> 다음 운동부터 적용됩니다</div></div></div>`;});
  prs.forEach(p=>{const ex=EX[p.id];html+=`<div class="badge"><div class="ic">PR</div>
    <div><div class="tt">신기록 · ${ex.n}</div>

function pick(k,v,el){

function saveSession(){

  l.memo=($('finMemo')&&$('finMemo').value||'').slice(0,140);

  (finState.ups||[]).forEach(u=>{DB.levels[u.pat]=curLevel(u.pat)+1;DB.clears[u.pat]=0;});

function heatHTML(){
  const start=isoWeekKey(Date.now())-7*7*86400000;
  const set={};DB.logs.forEach(l=>{if(!l.legacy)set[dnum(l.date)]=(set[dnum(l.date)]||0)+1;});
  // 가로 8주 x 세로 월~일
  let out='<div class="heat">';
  for(let d=0;d<7;d++){
    for(let w=0;w<8;w++){
      const t=start+w*7*86400000+d*86400000;
      const c=set[dnum(t)]||0;const fut=t>today0()+86400000;
      out+=`<i class="${fut?'fut':c>=2?'l3':c===1?'l2':''}"></i>`;
    }
  }
  out+='</div><div class="hlbl">';
  for(let w=0;w<8;w++){const t=start+w*7*86400000;
    out+=`<div>${w%2===0?(new Date(t).getMonth()+1)+'/'+new Date(t).getDate():''}</div>`;}
  out+='</div><div class="xs mut" style="margin-top:8px">가로=주, 세로=월~일. 진할수록 그날 운동함</div>';
  return out;
}

    <i style="width:${ar.코어/tot*100}%;background:#f5c451"></i></div>
    <div class="row xs mut" style="gap:14px">
      <span><b style="color:#3ad6c4">■</b> 상체 ${ar.상체}세트</span>
      <span><b style="color:#5b8cff">■</b> 하체 ${ar.하체}세트</span>
      <span><b style="color:#f5c451">■</b> 코어 ${ar.코어}세트</span></div>`;

  /* PR */

  Object.keys(DB.prs).sort((a,b)=>DB.prs[b].date-DB.prs[a].date).slice(0,8).forEach(id=>{

function coach(real,wks,keys,ar){
  const t=[];const target=+DB.profile.days||3;
  const wk=weekSessions().length;
  const now=isoWeekKey(Date.now());

  if(wk>=target)t.push(['good',`이번 주 목표 ${target}회를 채웠어요. 이게 3주 이어지면 몸이 바뀌기 시작합니다.`]);
  else{
    const left=target-wk;const dleft=7-((new Date().getDay()+6)%7);
    t.push([left>dleft?'bad':'warn',`이번 주 ${left}번 남았고, 남은 날은 ${dleft}일이에요.${left>dleft?' 오늘 하지 않으면 목표를 못 채웁니다.':''}`]);
  }

  const st=streakWeeks();
  if(st>=2)t.push(['good',`${st}주 연속 목표 달성 중. 지금이 제일 무너지기 쉬운 구간이니 이번 주만 버티세요.`]);

  // 상하체 불균형
  const tot=ar.상체+ar.하체||1;
  if(ar.상체>ar.하체*2)t.push(['warn','하체 세트가 상체의 절반도 안 됩니다. 무릎 보호를 위해서라도 하체(엉덩이·뒤허벅지)를 빼먹지 마세요.']);
  if(ar.하체>ar.상체*2)t.push(['warn','상체가 부족해요. 턱걸이·푸쉬업 쪽을 채우세요.']);
  if(ar.코어===0&&tot>6)t.push(['warn','코어 세트가 0입니다. 마지막 블록을 건너뛰고 계신 것 같아요.']);

  // 시간
  const am=avgMin(),goalm=+DB.profile.minutes||30;
  if(am>goalm+10)t.push(['warn',`평균 ${am}분으로 목표 ${goalm}분보다 깁니다. 휴식 시간을 줄이거나 짝운동 사이를 15초로 지키세요.`]);
  if(am>0&&am<goalm-12)t.push(['','평소보다 빨리 끝나고 있어요. 세트당 횟수를 목표 상단까지 채워보세요.']);

  // 정체
  Object.keys(LADDER).forEach(p=>{
    const arr=LADDER[p];const id=arr[curLevel(p)-1];
    const perf=lastPerf(id);
    if(!perf)return;
    const ex=EX[id];
    const older=real.filter(l=>(l.entries||[]).some(e=>e.id===id));
    if(older.length>=4){
      const first=older[older.length-4];
      const fe=first.entries.find(e=>e.id===id);
      const fb=fe?fe.sets.reduce((a,s)=>Math.max(a,s.sec||s.reps||0),0):0;
      if(fb&&perf.reps<=fb)t.push(['warn',`${ex.n}이(가) 4번째 제자리예요. 3초 템포로 내리거나 휴식을 15초 줄여보세요.`]);
    }
  });

  // 무릎
  const kbad=DB.logs.filter(l=>l.kneeAfter==='아팠음').length;
  if(kbad>=2)t.push(['bad',`운동 후 무릎 통증이 ${kbad}번 기록됐어요. 하체는 힌지(RDL·스윙) 위주로 유지하고 전문의 상담을 권합니다.`]);
  else if(kbad===1)t.push(['warn','최근 무릎 통증이 한 번 있었어요. 다음 세션에서 하체 강도를 한 단계 낮춰보세요.']);
  else if(real.length>=4)t.push(['good','무릎 통증 기록 없이 진행 중입니다. 준비운동의 클램쉘을 계속 지키세요.']);

  // 러닝 병행
  if(real.length>=6)t.push(['','하체 한 날 바로 다음날 러닝은 피하세요. 하체 → 하루 쉬고 러닝 순서가 무릎에 가장 안전합니다.']);

  return t.slice(0,7).map(x=>`<div class="tip ${x[0]}"><div class="ic"></div><div>${x[1]}</div></div>`).join('');
}

  return `<svg class="bodymap" width="118" height="200" viewBox="0 0 100 105">
    <g fill="#25406b">
      <circle cx="50" cy="9" r="7"/><rect x="34" y="18" width="32" height="34" rx="9"/>
      <rect x="14" y="21" width="10" height="30" rx="5"/><rect x="76" y="21" width="10" height="30" rx="5"/>
      <rect x="16" y="47" width="8" height="14" rx="4"/><rect x="76" y="47" width="8" height="14" rx="4"/>
      <rect x="36" y="50" width="28" height="12" rx="5"/>
      <rect x="34" y="58" width="13" height="26" rx="6"/><rect x="53" y="58" width="13" height="26" rx="6"/>
      <rect x="35" y="80" width="10" height="22" rx="5"/><rect x="55" y="80" width="10" height="22" rx="5"/>
    </g>${hi}
    <text x="50" y="105" font-size="6" fill="#8ea3c4" text-anchor="middle">몸 ${b.s}쪽</text></svg>`;
}
function showGuide(id){
  const e=EX[id];if(!e)return;const g=e.g;
  guideSheet(e.n,e.e,e.m,g);
}
function showGuideW(i){
  const w=WARM[i];if(!w)return;
  guideSheet(w.n,w.e,'',w.g);
}
function guideSheet(name,easy,muscle,g){
  const steps=(g.steps||[]).map((s,i)=>`<div class="gnum"><div class="n">${i+1}</div><div class="t">${s}</div></div>`).join('');
  const tips=(g.tips&&g.tips.length)?`<div class="gbox tip"><span class="gt">잘하는 법</span><ul>${g.tips.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'';
  const av=(g.avoid&&g.avoid.length)?`<div class="gbox bad"><span class="gt">이건 조심하세요</span><ul>${g.avoid.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'';
  const kn=g.knee?`<div class="gbox knee"><span class="gt">무릎</span>${g.knee}</div>`:'';
  const yt='https://www.youtube.com/results?search_query='+encodeURIComponent(g.yt||name);
  $('guideBody').innerHTML=`<div class="grab"></div>
    <div class="sh-t">${name}</div>
    <div class="mut sm" style="margin-bottom:12px">${easy}</div>
    <div class="row" style="align-items:flex-start;gap:14px">
      ${muscle?bodySVG(muscle):''}
      <div style="flex:1"><div class="card flat sm" style="margin:0">${g.sum||''}</div>
      ${muscle?`<div class="pill acc" style="margin-top:10px">쓰는 곳 · ${muscle}</div>`:''}</div>
    </div>
    <div class="gsteps">${steps}</div>${tips}${av}${kn}
    <a class="ytb" href="${yt}" target="_blank" rel="noopener">유튜브에서 영상으로 보기</a>
    <button class="btn ghost mut" style="margin-top:10px" onclick="closeGuide()">닫기</button>`;
  $('guideModal').classList.add('on');
}
function closeGuide(){$('guideModal').classList.remove('on');}

/* ==================== 설정 ==================== */
function openSettings(){
  const p=DB.profile,o=DB.opt;
  $('stWeight').value=p.weight;$('stAge').value=p.age;
  $('stDb').value=p.db;$('stKb').value=p.kb;
  segPick('stDays',String(p.days));segPick('stMin',String(p.minutes));
  segPick('stDbN',String(p.dbN));segPick('stRest',String(o.rest));
  $('swPull').classList.toggle('on',!!p.pullbar);
  $('swKnee').classList.toggle('on',!!p.knee);
  $('swWake').classList.toggle('on',!!o.wake);
  $('swSound').classList.toggle('on',!!o.sound);
  $('swVib').classList.toggle('on',!!o.vib);
  $('setModal').classList.add('on');
}
function closeSettings(){$('setModal').classList.remove('on');}
function segPick(id,v){[...$(id).children].forEach(b=>b.classList.toggle('on',b.dataset.v===v));}
function segGet(id){const b=$(id).querySelector('button.on');return b?b.dataset.v:null;}
function saveSettings(){
  const p=DB.profile,o=DB.opt;
  p.weight=+$('stWeight').value||75; p.age=+$('stAge').value||45;
  p.db=+$('stDb').value||8; p.kb=+$('stKb').value||10;
  p.days=+segGet('stDays')||3; p.minutes=+segGet('stMin')||30; p.dbN=+segGet('stDbN')||2;
  p.pullbar=$('swPull').classList.contains('on');
  p.knee=$('swKnee').classList.contains('on');
  o.wake=$('swWake').classList.contains('on');
  o.sound=$('swSound').classList.contains('on');
  o.vib=$('swVib').classList.contains('on');
  o.rest=+segGet('stRest')||60;
  save();closeSettings();go(TAB);toast('설정을 저장했어요');
}
function exportData(){
  const blob=new Blob([JSON.stringify(DB)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='머슬플랜_백업_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast('백업 파일을 저장했어요');
}
function importData(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);
    if(!d||!d.logs)throw 0;
    if(!confirm('지금 기록을 덮어씁니다. 진행할까요?'))return;
    localStorage.setItem(KEY,JSON.stringify(d));DB=loadDB();
    closeSettings();go('home');toast('불러오기 완료');
  }catch(e){toast('파일을 읽을 수 없어요');}};
  r.readAsText(f);inp.value='';
}
function resetAll(){
  if(!confirm('모든 기록이 사라집니다. 정말 지울까요?'))return;
  if(!confirm('되돌릴 수 없습니다. 한 번 더 확인할게요.'))return;
  localStorage.removeItem(KEY);DB=blank();save();closeSettings();go('home');toast('초기화했어요');
}

/* ==================== 시작 ==================== */
save();
go('home');
guardPush();                    // 뒤로가기를 가로챌 히스토리 가드 1개 깔아두기
window.addEventListener('pagehide',sessSave);   // 앱이 내려갈 때 마지막으로 한 번 더 저장
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden')sessSave();});
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
document.addEventListener('touchstart',()=>{ if(!AC&&DB.opt.sound){
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } },{once:true});
</script>
</body>
</html>
